# Descarga a img/futbin/ las banderas, ligas y escudos de futbin (tools/futbin_imgs.py) y los
# guarda en el repo. Corre al cambiar tools/futbin_imgs.py o market.json, o a mano desde Actions.
name: Imágenes de futbin

on:
  push:
    branches: [main]
    paths: [tools/futbin_imgs.py, market.json]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  imgs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: python3 tools/futbin_imgs.py
      - name: Guardar en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add img/futbin
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Imágenes de futbin (banderas, ligas y escudos) para el walkout"
          git push
