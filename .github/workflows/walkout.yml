# Video "walkout" de una compra del Mercado abierto para el grupo de WhatsApp.
# Lo dispara la base de datos (walkout_dispatch, ver supabase/sql/2026-11-15-walkout-video.sql)
# con el id y el token de un solo uso del job. Graba walkout/render.html con
# walkout/record.js y entrega el MP4 a la función walkout de Supabase, que lo manda.
# Si algo falla, pide el plan B (el mensaje de antes con la foto).
name: Video de compra (walkout)
run-name: Walkout ${{ inputs.job }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: id del walkout_jobs
        required: true
      token:
        description: token de un solo uso del job
        required: true
      api:
        description: url de la función walkout
        required: true

permissions:
  contents: read

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      API: ${{ inputs.api }}
      JOB: ${{ inputs.job }}
      TOKEN: ${{ inputs.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            walkout
            market.json
            img/futbin
          sparse-checkout-cone-mode: false
      # Usa el Chrome que ya trae el servidor de GitHub (sin descargar navegador ni paquetes del
      # sistema, que a veces se quedaban colgados); solo baja la librería y el ffmpeg de la grabación.
      # Cada descarga tiene tiempo límite y hasta 3 intentos.
      - name: Preparar navegador y ffmpeg
        working-directory: walkout
        timeout-minutes: 3
        run: |
          npm init -y >/dev/null
          for i in 1 2 3; do timeout 60 npm i --no-audit --no-fund --loglevel=error playwright@1.63.0 ffmpeg-static@5.2.0 && break; echo "reintento $i"; done
          for i in 1 2 3; do timeout 60 npx playwright install ffmpeg && break; echo "reintento $i"; done
      - name: Grabar y enviar
        timeout-minutes: 4
        env:
          CHROME_CHANNEL: chrome
        run: node walkout/record.js
      - name: Plan B (mensaje con foto)
        if: failure()
        run: |
          curl -sS -X POST "$API?job=$JOB&token=$TOKEN&fail=1&why=workflow" -H "Content-Type: application/json" -d '{}'
