<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torneo FC27 — Liga entre amigos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1410;
    --bg-2: #0e1a15;
    --surface: #142822;
    --surface-2: #1b332a;
    --line: rgba(255,255,255,0.09);
    --text: #f3f7f4;
    --text-muted: #93a99e;
    --accent: #3ecb71;
    --accent-strong: #2fa85d;
    --accent-ink: #06170e;
    --gold: #e7b75d;
    --red: #e5573d;
    --blue: #5fa8d3;
    --font-display: 'Barlow Condensed', 'Oswald', sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --radius: 14px;
    --radius-sm: 9px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f6f1; --bg-2: #eaf1e6; --surface: #ffffff; --surface-2: #edf4ea;
      --line: rgba(10,30,20,0.12); --text: #10201a; --text-muted: #55685e;
      --accent: #1f9c52; --accent-strong: #167a40; --accent-ink: #ffffff;
      --gold: #a8781f; --red: #c7402a; --blue: #2e77a6;
    }
  }
  :root[data-theme="light"] {
    --bg: #f3f6f1; --bg-2: #eaf1e6; --surface: #ffffff; --surface-2: #edf4ea;
    --line: rgba(10,30,20,0.12); --text: #10201a; --text-muted: #55685e;
    --accent: #1f9c52; --accent-strong: #167a40; --accent-ink: #ffffff;
    --gold: #a8781f; --red: #c7402a; --blue: #2e77a6;
  }
  :root { --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100; --series-5: #e87ba4; --series-6: #008300; --series-7: #4a3aa7; --series-8: #e34948; }
  }
  :root[data-theme="light"] { --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100; --series-5: #e87ba4; --series-6: #008300; --series-7: #4a3aa7; --series-8: #e34948; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body);
    padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-font-smoothing: antialiased;
  }
  #app { min-height: 100%; }
  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }
  input[type="number"], input[type="text"], input[type="email"], input[type="password"] { font-family: inherit; }

  .wrap { max-width: 920px; margin: 0 auto; padding: 0 18px 64px; }
  .hidden { display: none !important; }

  .hero {
    position: relative; overflow: hidden;
    padding: calc(56px + env(safe-area-inset-top, 0px)) 18px 40px;
    background: radial-gradient(ellipse 120% 80% at 50% -10%, rgba(62,203,113,0.18), transparent 60%),
      linear-gradient(180deg, var(--bg-2), var(--bg) 70%);
    border-bottom: 1px solid var(--line);
  }
  .hero-inner { max-width: 640px; margin: 0 auto; text-align: center; position: relative; z-index: 2; }
  .hero-eyebrow { font-family: var(--font-display); font-size: 15px; letter-spacing: 0.04em; color: var(--accent); font-weight: 600; margin: 0 0 6px; }
  .hero h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(40px, 9vw, 64px); line-height: 0.95; margin: 0 0 12px; letter-spacing: -0.01em; }
  .hero p.lead { color: var(--text-muted); font-size: 16px; line-height: 1.5; margin: 0 auto 28px; max-width: 46ch; }
  .pitch-art { width: 190px; height: 190px; margin: 0 auto 22px; display: block; }

  .setup-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; text-align: left; max-width: 640px; margin: 0 auto; }
  .setup-card h2 { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 0 0 4px; }
  .setup-card .hint { color: var(--text-muted); font-size: 14px; margin: 0 0 18px; line-height: 1.5; }

  .count-row { display: flex; gap: 10px; margin-bottom: 26px; }
  .count-btn {
    flex: 1; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    color: var(--text); font-family: var(--font-display); font-weight: 700; font-size: 30px;
    padding: 14px 0 10px; display: flex; flex-direction: column; align-items: center;
    transition: border-color .15s ease, transform .1s ease, background .15s ease;
  }
  .count-btn span.lbl { font-family: var(--font-body); font-size: 11px; font-weight: 600; color: var(--text-muted); margin-top: 2px; }
  .count-btn:hover { border-color: var(--accent); }
  .count-btn:active { transform: scale(0.97); }
  .count-btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .count-btn.active span.lbl { color: var(--accent-ink); opacity: 0.75; }

  .name-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 22px; }
  .name-row { display: flex; align-items: center; gap: 10px; }
  .name-row .num { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--text-muted); width: 24px; text-align: right; flex-shrink: 0; }
  .text-input {
    flex: 1; background: var(--bg-2); border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    color: var(--text); padding: 11px 13px; font-size: 15px; outline: none;
  }
  .text-input:focus { border-color: var(--accent); }
  .text-input:disabled { opacity: 0.8; -webkit-text-fill-color: var(--text); color: var(--text); cursor: not-allowed; }

  .btn-primary {
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: var(--radius-sm);
    font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: 0.01em;
    padding: 13px 22px; width: 100%; transition: background .15s ease, transform .1s ease;
  }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn-primary:active { transform: scale(0.985); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-secondary {
    background: transparent; color: var(--text); border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    font-family: var(--font-body); font-weight: 600; font-size: 14px; padding: 9px 14px;
  }
  .btn-secondary:hover { border-color: var(--accent); }

  .topbar {
    position: sticky; top: 0; z-index: 20; background: var(--bg); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px);
  }
  .topbar-inner { max-width: 920px; margin: 0 auto; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { font-family: var(--font-display); font-weight: 700; font-size: 21px; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .brand .dot.live { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .topbar-actions { display: flex; gap: 4px; align-items: center; }
  .icon-btn { background: transparent; border: none; color: var(--text-muted); width: 34px; height: 34px; border-radius: 8px; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { color: var(--text); background: var(--surface-2); }

  .tabs { max-width: 920px; margin: 0 auto; padding: 10px 18px 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  /* En escritorio: una fila con barra de desplazamiento delgada que solo
     aparece al pasar el mouse (la rueda también desplaza a los lados). */
  @media (min-width: 900px) and (hover: hover) {
    .tabs { max-width: none; margin: 0 18px; padding: 10px 0 6px; scrollbar-width: thin; scrollbar-color: transparent transparent; }
    .tabs:hover { scrollbar-color: color-mix(in srgb, var(--text-muted) 55%, transparent) transparent; }
    .tabs::-webkit-scrollbar { display: block; height: 6px; }
    .tabs::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
    .tabs:hover::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text-muted) 55%, transparent); }
  }
  .tab-btn {
    flex-shrink: 0; background: var(--surface); border: 1.5px solid var(--line); color: var(--text-muted);
    font-family: var(--font-display); font-weight: 700; font-size: 15px; padding: 8px 15px 6px; border-radius: 20px;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .tab-btn .flag { width: 6px; height: 6px; border-radius: 50%; }
  .tab-btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tab-btn.done:not(.active) .flag { background: var(--gold); }
  .tab-btn.progress:not(.active) .flag { background: var(--blue); }
  .tab-btn.pending:not(.active) .flag { background: transparent; border: 1px solid var(--text-muted); }

  .section { margin-top: 26px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
  .section-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0; }
  .section-head .sub { color: var(--text-muted); font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .empty-state { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 28px 20px; text-align: center; color: var(--text-muted); font-size: 14px; line-height: 1.6; }

  .attend-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 8px; margin: 16px 0 20px; }
  .attend-chip { display: flex; align-items: center; gap: 9px; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 600; }
  .attend-chip input { width: 17px; height: 17px; accent-color: var(--accent); }
  .attend-chip.disabled { opacity: 0.55; }
  table.reg-matrix { border-collapse: separate; border-spacing: 0; margin: 14px 0 18px; }
  table.reg-matrix th, table.reg-matrix td { padding: 9px 10px; text-align: center; border-bottom: 1px solid var(--line); }
  table.reg-matrix thead th { font-size: 13.5px; font-weight: 700; white-space: nowrap; }
  table.reg-matrix tbody th { text-align: left; font-size: 13.5px; font-weight: 600; white-space: nowrap; position: sticky; left: 0; background: var(--surface); z-index: 1; }
  table.reg-matrix tbody th small { display: block; font-weight: 500; color: var(--text-muted); font-size: 11.5px; }
  table.reg-matrix tr:last-child th, table.reg-matrix tr:last-child td { border-bottom: none; }
  table.reg-matrix input { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
  table.reg-matrix input:disabled { cursor: not-allowed; }
  table.reg-matrix td.off { opacity: .35; }
  @media (max-width: 600px) {
    table.reg-matrix tbody th { white-space: normal; min-width: 108px; max-width: 120px; font-size: 12.5px; }
    table.reg-matrix th, table.reg-matrix td { padding: 8px 7px; }
  }
  table.reg-matrix td.na { color: var(--text-muted); }
  table.reg-matrix td.flag { background: color-mix(in srgb, var(--red) 10%, transparent); }
  .attend-note { font-size: 13px; color: var(--text-muted); margin: 0 0 4px; }
  .attend-warn { color: var(--red); font-weight: 600; }
  .lock-note { display: flex; align-items: center; gap: 6px; color: var(--gold); font-size: 12.5px; font-weight: 600; margin: 0 0 14px; }

  .round-block { margin-bottom: 18px; }
  .round-label { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--text-muted); margin: 0 0 8px 2px; }
  .match-card { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; margin-bottom: 8px; }
  .match-side { flex: 1; display: flex; align-items: center; gap: 7px; min-width: 0; }
  .match-side.away { flex-direction: row-reverse; text-align: right; }
  .match-name { font-weight: 600; font-size: 14.5px; white-space: normal; word-break: break-word; line-height: 1.2; }
  .score-inputs { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .score-box {
    width: 40px; height: 38px; text-align: center; background: var(--bg-2); border: 1.5px solid var(--line); border-radius: 8px;
    color: var(--text); font-family: var(--font-display); font-weight: 700; font-size: 18px; -moz-appearance: textfield;
  }
  .score-box::-webkit-outer-spin-button, .score-box::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .score-box:focus { outline: none; border-color: var(--accent); }
  .score-box:disabled { opacity: 0.8; -webkit-text-fill-color: var(--text); color: var(--text); cursor: not-allowed; }
  .score-sep { color: var(--text-muted); font-family: var(--font-display); font-weight: 700; }
  .match-played-badge { color: var(--accent); font-size: 15px; flex-shrink: 0; width: 18px; text-align: center; }

  .shootout-bar { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 9px; padding: 9px 12px; margin: -3px 0 8px; font-size: 13px; }
  .shootout-bar .label { color: var(--text-muted); flex-basis: 100%; font-size: 12px; text-align: center; }
  .pk-btn { background: var(--bg-2); border: 1.5px solid var(--line); border-radius: 7px; color: var(--text); font-size: 13px; font-weight: 600; padding: 6px 11px; }
  .pk-btn.selected { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pk-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .pk-tag { font-size: 10px; font-weight: 800; color: var(--gold); letter-spacing: .03em; }

  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
  table.standings { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 610px; }
  table.standings th, table.standings td { padding: 10px 8px; text-align: center; border-bottom: 1px solid var(--line); }
  table.standings th { font-family: var(--font-body); font-weight: 600; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; background: var(--surface-2); }
  table.standings td.name-cell { text-align: left; font-weight: 700; font-family: var(--font-display); font-size: 16px; }
  table.standings td.pos-cell { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--text-muted); width: 30px; }
  table.standings tr:last-child td { border-bottom: none; }
  table.standings td.pts-cell { font-weight: 800; color: var(--accent); font-size: 15px; }
  table.standings tr.qualifies td.pos-cell { color: var(--accent); }
  table.standings.compact { min-width: 0; }
  table.standings.compact th, table.standings.compact td { padding: 9px 5px; white-space: nowrap; }
  table.standings.compact th { font-size: 10px; letter-spacing: 0; }
  table.standings.compact td.name-cell { padding-left: 12px; }
  table.standings.compact th:first-child { padding-left: 12px; }
  table.standings tr.absent td { color: var(--text-muted); }
  table.standings .mv { font-size: 11px; font-weight: 700; color: var(--text-muted); }
  table.standings .mv.up { color: var(--accent); }
  table.standings .mv.down { color: var(--red); }
  .rewards-block { margin-bottom: 22px; }
  .rewards-block .sub-note { font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--text-muted); text-transform: none; letter-spacing: 0; }
  .empty-note { color: var(--text-muted); font-size: 14px; }
  /* ---------- shell con módulos ---------- */
  .shell { display: flex; min-height: 100vh; }
  .main { flex: 1; min-width: 0; }
  .sidenav {
    width: 200px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    background: var(--surface); border-right: 1px solid var(--line);
    padding: calc(16px + env(safe-area-inset-top, 0px)) 12px 16px; z-index: 60;
  }
  .sidenav-brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 8px; padding: 4px 8px 18px; }
  .sidenav-brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .sidenav nav { display: flex; flex-direction: column; gap: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: transparent; border: none; color: var(--text-muted); border-radius: 10px;
    font-family: var(--font-display); font-weight: 700; font-size: 17px; padding: 10px 12px;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: var(--accent); color: var(--accent-ink); }
  .nav-ic { width: 22px; text-align: center; }
  .nav-toggle { display: none; margin-left: -8px; }
  .brand-module { color: var(--text); }
  .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .nav-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 55; }
  @media (max-width: 899px) {
    .sidenav { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-105%); transition: transform .2s ease; box-shadow: 0 0 40px rgba(0,0,0,.35); }
    .sidenav.open { transform: translateX(0); }
    .nav-toggle { display: flex; }
  }
  .topbar-inner.wide, .wrap.wide { max-width: 1400px; }
  /* Con panel lateral, encabezado, pestañas y contenido alineados a la izquierda. */
  @media (min-width: 900px) { .main .topbar-inner, .main .wrap { margin-left: 0; } }
  .muted { color: var(--text-muted); }
  .test-banner { position: sticky; top: 0; z-index: 90; background: #d97706; color: #fff; text-align: center; font-weight: 700; font-size: 12.5px; letter-spacing: .04em; padding: 5px 10px; }
  body.test-env .topbar, body.test-env .sidenav { top: 27px; }
  body.test-env .mini-topbar { top: calc(41px + env(safe-area-inset-top, 0px)); }
  @media (max-width: 640px) { .test-banner .tb-long { display: none; } }
  body.test-env .sidenav { height: calc(100vh - 27px); }
  .fc-sym { width: .46em; height: .64em; vertical-align: -.04em; margin-right: .03em; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
  .neg { color: var(--red); }
  .pos { color: var(--accent); }
  .fc-text { color: var(--blue); }
  .modal-box .attend-warn, .modal-box .neg { color: var(--red); }
  .modal-box .fc-text { color: var(--blue); }

  /* ---------- equipos ---------- */
  .team-head h2 { font-size: 38px; line-height: 1.05; }
  .team-logo { display: inline-block; object-fit: contain; flex: 0 0 auto; vertical-align: middle; }
  .team-title { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .team-title .team-sub { display: block; font-family: var(--font-body); font-size: 14px; font-weight: 600; color: var(--text-muted); margin-top: 2px; }
  .team-edit { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 16px; padding: 12px 14px; }
  .team-edit .text-input { flex: 1 1 200px; padding: 8px 10px; font-size: 14px; }
  .team-edit .lu-file { padding: 8px 12px; }
  .team-edit .lbl { font-size: 12.5px; font-weight: 700; color: var(--text-muted); width: 100%; }

  .team-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .stat-card { display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; }
  .stat-card .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); font-weight: 600; }
  .stat-card .val { font-family: var(--font-display); font-weight: 800; font-size: 36px; color: var(--text); line-height: 1; }
  .stat-card .val.saldo { color: var(--blue); }
  .stat-card .val.neg { color: var(--red); }
  @media (max-width: 560px) {
    .team-head h2 { font-size: 32px; }
    .team-stats { gap: 8px; }
    .stat-card { padding: 12px 10px; }
    .stat-card .lbl { font-size: 10px; letter-spacing: .02em; }
    .stat-card .val { font-size: 26px; }
  }
  .gt-chart { margin-top: 18px; padding: 16px 16px 10px; }
  .gt-chart-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 8px; }
  .gt-chart-head h3 { font-family: var(--font-display); font-weight: 700; font-size: 19px; margin: 0; }

<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  /* ============================== supabase config ============================== */
  // Base real solo en torneofifa.com; en cualquier otro lugar (el sitio de
  // pruebas vickrdzdev.github.io/torneofifa-pruebas, copias locales) se usa la base de pruebas.
  const PROD_HOSTS = ["torneofifa.com", "www.torneofifa.com"];
  const IS_TEST_ENV = !PROD_HOSTS.includes(location.hostname);
  const SUPABASE_URL = IS_TEST_ENV
    ? "https://bcvzgwnwjtcmtbhwruhi.supabase.co"      // torneofifa-pruebas
    : "https://zohacxiwuapnziicaarj.supabase.co";     // torneofifa (real)
  const SUPABASE_KEY = IS_TEST_ENV
    ? "sb_publishable_9wJ9d3Z2o1VM6H0RgQcSaw_9h78D3bJ"
    : "sb_publishable_dlamj0bnGrk7VTYLZNARVQ_XfVNCAq8";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  if (IS_TEST_ENV) {
    document.body.classList.add("test-env");
    document.title = "[PRUEBAS] " + document.title;
    const banner = document.createElement("div");
    banner.className = "test-banner";
    banner.innerHTML = 'MODO PRUEBAS<span class="tb-long"> · base de datos de pruebas (no afecta el torneo real)</span>';
    document.body.insertBefore(banner, document.body.firstChild);
  }

  const JORNADA_COUNT = 12;

  /* ============================== helpers ============================== */
  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }

  let toastMessage = null;
  let toastTimer = null;
  function showToast(msg) {
    toastMessage = msg;
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastMessage = null; render(); }, 3600);
  }

  let helpOpen = false;
  let loginOpen = false;
  let loginError = "";
  let activeTab = null;
  let isAdmin = false;
  let hasSession = false;
  let sessionEmail = "";
  let myPlayerIds = [];       // players ligados al correo de la sesión
  let playerAccounts = [];    // correos ligados (el admin ve todos; un player, el suyo)
  let luTab = null;           // pestaña del módulo Alineaciones
  let luDrafts = {};          // cambios sin guardar por "jornadaId:playerId"
  let luSaving = null;
  let accDrafts = {};
  let statsTab = "general";   // "general" | "resumen" | "h2h" | "recompensas" | "palmares"
  let magnaDraft = null;      // selección de la Final Magna aún sin guardar
  let penPlayer = "";         // filtro del historial de Penalizaciones
  let penForm = { player: "", jornada: "", kind: "alineacion", note: "" };
  let penSaving = false;
  let statsFilter = "all";    // "all" | "group" | "ko"
  let loading = true;
  let state = null; // { season, players, jornadas: [...], purchases: [...] }
  // Módulos: "torneo" | "equipos" | "mercado"
  let activeModule = "torneo";
  let navOpen = false;
  let teamsTab = null;
  let market = null;          // jugadores del mercado (market.json)
  let marketLoading = false;
  let marketError = false;
  let marketQuery = "";
  let marketPos = "";
  let marketOnlyAvailable = false;
  let marketPage = 0;
  let txPlayer = "";          // filtro de Transacciones por persona
  let txKind = "";            // filtro por tipo
  let buyCardId = null;       // modal de compra abierto
  let buyTeamId = null;

  // Escudo del equipo real del player (lo configura el admin en Equipos).
  function teamLogoHtml(id, size) {
    const p = state && state.players.find(pl => pl.id === id);
    const url = p && p.logo_path && (state.logoUrls || {})[p.logo_path];
    if (!url) return "";
    return `<img class="team-logo" src="${escapeHtml(url)}" alt="${escapeHtml(p.team_name || "")}" title="${escapeHtml(p.team_name || "")}" width="${size}" height="${size}" loading="lazy">`;
  }
  function playerName(id) {
    const p = state.players.find(pl => pl.id === id);
    return p ? p.name : "?";
  }

  /* ============================== round robin + home balance (pure logic) ============================== */
  // Balance de localía acumulado en Jornadas anteriores de la temporada:
  // veces de local menos la mitad de los partidos jugados (0 = equilibrado,
  // positivo = ha sido local de más). Así quien faltó a una Jornada no queda
  // obligado a ser local en casi todo después.
  function priorHomeBalance(activeIds, uptoIndex) {
    const bal = {};
    activeIds.forEach(id => bal[id] = 0);
    for (let k = 0; k < uptoIndex; k++) {
      const j = state.jornadas[k];
      if (!j || !j.matches) continue;
      j.matches.forEach(m => {
        if (bal.hasOwnProperty(m.homeId)) bal[m.homeId] += 0.5;
        if (bal.hasOwnProperty(m.awayId)) bal[m.awayId] -= 0.5;
      });
    }
    return bal;
  }


  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const k = Math.floor(Math.random() * (i + 1));
      [a[i], a[k]] = [a[k], a[i]];
    }
    return a;
  }
  // Un calendario aleatorio: jugadores, fechas y partidos barajados; la
  // localía se asigna de forma greedy según el balance de localía de cada
  // quien (Jornadas anteriores + esta), con volado en caso de empate.
  function randomFixtures(ids, prior) {
    let arr = shuffle(ids);
    if (arr.length % 2 !== 0) arr.push(null);
    const n = arr.length;
    let roundsPairs = [];
    let rot = arr.slice();
    for (let r = 0; r < n - 1; r++) {
      const pairs = [];
      for (let i = 0; i < n / 2; i++) {
        const p1 = rot[i], p2 = rot[n - 1 - i];
        if (p1 !== null && p2 !== null) pairs.push([p1, p2]);
      }
      roundsPairs.push(shuffle(pairs));
      rot = [rot[0], rot[n - 1]].concat(rot.slice(1, n - 1));
    }
    roundsPairs = shuffle(roundsPairs);
    const local = {}, games = {};
    ids.forEach(id => { local[id] = 0; games[id] = 0; });
    const matches = [];
    roundsPairs.forEach((pairs, rIdx) => {
      pairs.forEach(([a, b]) => {
        const totalA = prior[a] + local[a] - games[a] / 2;
        const totalB = prior[b] + local[b] - games[b] / 2;
        let home, away;
        if (totalA < totalB) { home = a; away = b; }
        else if (totalB < totalA) { home = b; away = a; }
        else if (Math.random() < 0.5) { home = a; away = b; }
        else { home = b; away = a; }
        local[home]++; games[a]++; games[b]++;
        matches.push({
          id: null, round: rIdx + 1, homeId: home, awayId: away,
          homeGoals: null, awayGoals: null, shootoutWinnerId: null, played: false
        });
      });
    });
    // Costo de balance: primero el balance acumulado de la temporada, luego
    // que en esta Jornada cada quien sea local ~la mitad de sus partidos.
    const seasonCost = ids.reduce((acc, id) => acc + (prior[id] + local[id] - games[id] / 2) ** 2, 0);
    const jornadaCost = ids.reduce((acc, id) => acc + (local[id] - games[id] / 2) ** 2, 0);
    return { matches, cost: seasonCost * 1000 + jornadaCost };
  }
  // Genera muchos calendarios aleatorios y se queda con el mejor balanceado,
  // así el orden cambia cada vez sin sacrificar el balance de localía.
  function generateFixturesLocal(jIndex) {
    const jornada = state.jornadas[jIndex];
    const ids = jornada.activeIds.slice();
    const prior = priorHomeBalance(ids, jIndex);
    let best = null;
    for (let t = 0; t < 300; t++) {
      const cand = randomFixtures(ids, prior);
      if (!best || cand.cost < best.cost - 1e-9) best = cand;
    }
    jornada.matches = best.matches;
    jornada.playoff = null;
  }


  /* ============================== standings + tiebreaks (pure logic) ============================== */
  function headToHead(aId, bId, matches) {
    const m = matches.find(mm => mm.played &&
      ((mm.homeId === aId && mm.awayId === bId) || (mm.homeId === bId && mm.awayId === aId)));
    if (!m) return null;
    if (m.homeGoals === m.awayGoals) return m.shootoutWinnerId || null;
    return m.homeGoals > m.awayGoals ? m.homeId : m.awayId;
  }

  function miniTable(ids, matches) {
    const stats = {};
    ids.forEach(id => stats[id] = { pts: 0, gf: 0, gc: 0 });
    matches.forEach(m => {
      if (!m.played) return;
      if (!ids.includes(m.homeId) || !ids.includes(m.awayId)) return;
      const h = stats[m.homeId], a = stats[m.awayId];
      h.gf += m.homeGoals; h.gc += m.awayGoals;
      a.gf += m.awayGoals; a.gc += m.homeGoals;
      if (m.homeGoals > m.awayGoals) h.pts += 3;
      else if (m.awayGoals > m.homeGoals) a.pts += 3;
      else {
        if (m.shootoutWinnerId === m.homeId) { h.pts += 2; a.pts += 1; }
        else if (m.shootoutWinnerId === m.awayId) { a.pts += 2; h.pts += 1; }
        else { h.pts += 1; a.pts += 1; }
      }
    });
    return stats;
  }

  function breakTies(arr, matches) {
    arr.sort((x, y) => (y.pts - x.pts) || (y.gd - x.gd));
    const result = [];
    let i = 0;
    while (i < arr.length) {
      let j = i + 1;
      while (j < arr.length && arr[j].pts === arr[i].pts && arr[j].gd === arr[i].gd) j++;
      const group = arr.slice(i, j);
      if (group.length === 1) {
        result.push(group[0]);
      } else if (group.length === 2) {
        const w = headToHead(group[0].playerId, group[1].playerId, matches);
        if (w === group[1].playerId) result.push(group[1], group[0]);
        else result.push(group[0], group[1]);
      } else {
        const ids = group.map(g => g.playerId);
        const mt = miniTable(ids, matches);
        const sortedIds = ids.slice().sort((a, b) => {
          const pa = mt[a], pb = mt[b];
          const gdA = pa.gf - pa.gc, gdB = pb.gf - pb.gc;
          return (pb.pts - pa.pts) || (gdB - gdA) || (pb.gf - pa.gf);
        });
        sortedIds.forEach(id => result.push(group.find(g => g.playerId === id)));
      }
      i = j;
    }
    return result;
  }

  function computeStandings(jornada) {
    const stats = {};
    jornada.activeIds.forEach(id => stats[id] = { playerId: id, pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0, pts: 0, lc: 0 });
    jornada.matches.forEach(m => {
      if (!m.played) return;
      const h = stats[m.homeId], a = stats[m.awayId];
      if (!h || !a) return;
      h.pj++; a.pj++;
      h.gf += m.homeGoals; h.gc += m.awayGoals;
      a.gf += m.awayGoals; a.gc += m.homeGoals;
      if (m.homeGoals > m.awayGoals) { h.pg++; h.pts += 3; a.pp++; }
      else if (m.awayGoals > m.homeGoals) { a.pg++; a.pts += 3; h.pp++; }
      else {
        h.pe++; a.pe++;
        if (m.shootoutWinnerId === m.homeId) { h.pts += 2; a.pts += 1; h.lc += 1; }
        else if (m.shootoutWinnerId === m.awayId) { a.pts += 2; h.pts += 1; a.lc += 1; }
        else { h.pts += 1; a.pts += 1; }
      }
    });
    let arr = Object.values(stats);
    arr.forEach(s => s.gd = s.gf - s.gc);
    arr = breakTies(arr, jornada.matches);
    arr.forEach((s, i) => s.rank = i + 1);
    return arr;
  }

  /* ============================== playoffs (pure logic) ============================== */
  function makeKO(homeId, awayId) {
    return { id: null, homeId, awayId, homeGoals: null, awayGoals: null, shootoutWinnerId: null, played: false };
  }
  function getWinner(m) {
    if (!m || !m.played) return null;
    if (m.homeGoals > m.awayGoals) return m.homeId;
    if (m.awayGoals > m.homeGoals) return m.awayId;
    return m.shootoutWinnerId || null;
  }

  // Posición final de fase de grupos de cada jugador (rankOf) y sembrados
  // (seeds). No se guardan en la base: se recalculan desde la tabla.
  function playoffSeeding(jornada) {
    const standings = computeStandings(jornada);
    const rankOf = {}, seeds = {};
    standings.forEach(s => { rankOf[s.playerId] = s.rank; seeds[s.rank] = s.playerId; });
    return { rankOf, seeds };
  }
  function buildPlayoff(jornada) {
    const standings = computeStandings(jornada);
    const rankOf = {};
    standings.forEach(s => rankOf[s.playerId] = s.rank);
    const ranked = standings.map(s => s.playerId);
    const N = jornada.activeIds.length;
    let pf;
    if (N === 7) {
      const [s1, s2, s3, s4, s5, s6] = ranked;
      pf = {
        type: "7", rankOf, seeds: { 1: s1, 2: s2, 3: s3, 4: s4, 5: s5, 6: s6 },
        repechaje: [makeKO(s3, s6), makeKO(s4, s5)],
        semis: [], final: null, championId: null
      };
    } else {
      const [s1, s2, s3, s4] = ranked;
      pf = {
        type: "4", rankOf, seeds: { 1: s1, 2: s2, 3: s3, 4: s4 },
        repechaje: [],
        semis: [makeKO(s1, s4), makeKO(s2, s3)],
        final: null, championId: null
      };
    }
    jornada.playoff = pf;
    advanceChain(jornada);
  }

  function advanceChain(jornada) {
    const pf = jornada.playoff;
    if (!pf) return;
    if (pf.type === "7" && pf.semis.length === 0) {
      const w1 = getWinner(pf.repechaje[0]), w2 = getWinner(pf.repechaje[1]);
      if (w1 && w2) {
        const four = [pf.seeds[1], pf.seeds[2], w1, w2].sort((a, b) => pf.rankOf[a] - pf.rankOf[b]);
        pf.semis = [makeKO(four[0], four[3]), makeKO(four[1], four[2])];
      }
    }
    if (pf.semis.length === 2 && !pf.final) {
      const w1 = getWinner(pf.semis[0]), w2 = getWinner(pf.semis[1]);
      if (w1 && w2) {
        const home = pf.rankOf[w1] <= pf.rankOf[w2] ? w1 : w2;
        const away = home === w1 ? w2 : w1;
        pf.final = makeKO(home, away);
      }
    }
    if (pf.final) pf.championId = getWinner(pf.final);
  }

  /* ============================== supabase data layer ============================== */
  function mapMatchRow(r) {
    return { id: r.id, round: r.round, homeId: r.home_id, awayId: r.away_id, homeGoals: r.home_goals, awayGoals: r.away_goals, shootoutWinnerId: r.shootout_winner_id, played: r.played };
  }

  // Se incrementa con cada edición local; una recarga que empezó antes de una
  // edición se descarta para no pisar cambios que todavía no se guardan.
  let editGen = 0;
  async function loadSeasonData() {
    const gen = editGen;
    const { data: seasons, error: e1 } = await sb.from("seasons").select("*").eq("is_active", true).order("created_at", { ascending: false }).limit(1);
    if (e1) { showToast("No se pudo cargar la temporada."); state = null; return; }
    if (!seasons || !seasons.length) { state = null; return; }
    const season = seasons[0];

    const { data: players } = await sb.from("players").select("*").eq("season_id", season.id).order("sort_order");
    const { data: jornadasRows } = await sb.from("jornadas").select("*").eq("season_id", season.id).order("jornada_number");
    const jornadaIds = (jornadasRows || []).map(j => j.id);

    let attendance = [], matches = [];
    if (jornadaIds.length) {
      const [attRes, matRes] = await Promise.all([
        sb.from("jornada_attendance").select("*").in("jornada_id", jornadaIds),
        sb.from("matches").select("*").in("jornada_id", jornadaIds)
      ]);
      attendance = attRes.data || [];
      matches = matRes.data || [];
    }

    const jornadas = (jornadasRows || []).map(jr => {
      const activeIds = attendance.filter(a => a.jornada_id === jr.id).map(a => a.player_id);
      const allM = matches.filter(m => m.jornada_id === jr.id);
      const groupM = allM.filter(m => m.stage === "group").sort((a, b) => (a.round || 0) - (b.round || 0));
      const repM = allM.filter(m => m.stage === "repechaje");
      const semiM = allM.filter(m => m.stage === "semifinal");
      const finalM = allM.find(m => m.stage === "final") || null;

      let playoff = null;
      if (repM.length || semiM.length || finalM) {
        const finalMapped = finalM ? mapMatchRow(finalM) : null;
        playoff = {
          type: repM.length ? "7" : "4",
          repechaje: repM.map(mapMatchRow),
          semis: semiM.map(mapMatchRow),
          final: finalMapped,
          championId: finalMapped ? getWinner(finalMapped) : null
        };
      }
      const jornada = {
        id: jr.id, jornada_number: jr.jornada_number, label: jr.label, playDate: jr.play_date || null,
        console1Id: jr.console1_id || null, console2Id: jr.console2_id || null,
        updatedAt: allM.reduce((mx, m) => (m.created_at && m.created_at > mx ? m.created_at : mx), ""),
        activeIds, matches: groupM.map(mapMatchRow), playoff
      };
      if (playoff) Object.assign(playoff, playoffSeeding(jornada));
      return jornada;
    });

    // Si las compras no cargan, el Torneo sigue funcionando.
    let purchases = [];
    try {
      const res = await sb.from("team_purchases").select("*").eq("season_id", season.id).order("created_at");
      purchases = res.data || [];
    } catch (e) { purchases = []; }

    let passes = [];
    try {
      const res = await sb.from("draft_passes").select("*").eq("season_id", season.id).order("created_at");
      passes = res.data || [];
    } catch (e) { passes = []; }

    // Escudos de los equipos (privados): enlaces temporales de 12 h.
    const logoUrls = {};
    const logoPaths = (players || []).map(p => p.logo_path).filter(Boolean);
    if (logoPaths.length) {
      try {
        const { data } = await sb.storage.from("logos").createSignedUrls(logoPaths, 60 * 60 * 12);
        (data || []).forEach(x => { if (x && x.signedUrl) logoUrls[x.path] = x.signedUrl; });
      } catch (e) { /* sin escudos, el resto sigue */ }
    }

    let lineups = [];
    try {
      const res = await sb.from("lineups").select("*").eq("season_id", season.id);
      lineups = res.data || [];
    } catch (e) { lineups = []; }
    // Las imágenes son privadas: se piden enlaces temporales (12 h) con la sesión.
    const lineupUrls = {};
    const paths = [];
    lineups.forEach(l => { if (l.starters_path) paths.push(l.starters_path); if (l.bench_path) paths.push(l.bench_path); });
    if (paths.length) {
      try {
        const { data } = await sb.storage.from("lineups").createSignedUrls(paths, 60 * 60 * 12);
        (data || []).forEach(x => { if (x && x.signedUrl) lineupUrls[x.path] = x.signedUrl; });
      } catch (e) { /* sin imágenes, el resto sigue */ }
    }

    let penalties = [];
    try {
      const res = await sb.from("penalties").select("*").eq("season_id", season.id).order("created_at");
      penalties = res.data || [];
    } catch (e) { penalties = []; }

    if (gen !== editGen) return;
    state = { season, players: players || [], jornadas, purchases: purchases || [], passes, lineups, lineupUrls, logoUrls, penalties };
  }

  function newId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }
  // Asigna id a los partidos nuevos para que se conserve entre guardados
  // (así las casillas del marcador siguen apuntando al mismo partido).
  function ensureId(m) { if (!m.id) m.id = newId(); return m.id; }

  function flattenJornadaForPersist(jornada) {
    const rows = jornada.matches.map(m => ({

  /* ============================== render: match/table pieces ============================== */
  function scoreInputsHtml(m, onGoalAction, jornadaId) {
    const hv = m.homeGoals === null ? "" : m.homeGoals;
    const av = m.awayGoals === null ? "" : m.awayGoals;
    const dis = isAdmin ? "" : "disabled";
    return `
      <div class="score-inputs">
        <input class="score-box" type="number" min="0" inputmode="numeric" value="${hv}" ${dis}
          data-action="${onGoalAction}" data-j="${jornadaId}" data-match="${m.id}" data-side="home">
        <span class="score-sep">–</span>
        <input class="score-box" type="number" min="0" inputmode="numeric" value="${av}" ${dis}
          data-action="${onGoalAction}" data-j="${jornadaId}" data-match="${m.id}" data-side="away">
      </div>
      <span class="match-played-badge">${m.played ? "✓" : ""}</span>
    `;
  }

  function shootoutHtml(m, jornadaId, onPickAction, isKnockout) {
    if (m.homeGoals === null || m.awayGoals === null || m.homeGoals !== m.awayGoals) return "";
    const label = isKnockout
      ? "Empate — definición por penales, ¿quién avanza?"
      : "Empate — desempate \u201cLeagues Cup\u201d por penales, ¿quién gana la serie?";
    const dis = isAdmin ? "" : "disabled";
    return `
      <div class="shootout-bar">
        <span class="label">${label}</span>
        <button class="pk-btn ${m.shootoutWinnerId === m.homeId ? "selected" : ""}" ${dis} data-action="${onPickAction}" data-j="${jornadaId}" data-match="${m.id}" data-winner="${m.homeId}">${escapeHtml(playerName(m.homeId))}</button>
        <button class="pk-btn ${m.shootoutWinnerId === m.awayId ? "selected" : ""}" ${dis} data-action="${onPickAction}" data-j="${jornadaId}" data-match="${m.id}" data-winner="${m.awayId}">${escapeHtml(playerName(m.awayId))}</button>
        ${m.shootoutWinnerId && !isKnockout ? '<span class="pk-tag">+2 / +1 PTS</span>' : ""}
      </div>
    `;
  }

  function matchCardHtml(m, jornadaId, isKnockout) {
    const goalAction = isKnockout ? "ko-goal" : "group-goal";
    const pickAction = isKnockout ? "ko-pk" : "group-pk";
    // Escudos en los partidos desde la J1 (en la J0 se juega con equipos estándar).
    const jj = state.jornadas.find(x => x.id === jornadaId);
    const logo = id => jj && jj.jornada_number > 0 ? teamLogoHtml(id, 24) : "";
    return `
      <div class="match-card">
        <div class="match-side home">
          ${logo(m.homeId)}<span class="match-name">${escapeHtml(playerName(m.homeId))}</span>
        </div>
        ${scoreInputsHtml(m, goalAction, jornadaId)}
        <div class="match-side away">
          ${logo(m.awayId)}<span class="match-name">${escapeHtml(playerName(m.awayId))}</span>
        </div>
      </div>
      ${shootoutHtml(m, jornadaId, pickAction, isKnockout)}
    `;
  }

  function standingsTableHtml(standings, qualifyCount) {
    const rows = standings.map(s => `
      <tr class="${s.rank <= qualifyCount ? "qualifies" : ""}">
        <td class="pos-cell">${s.rank}</td>
        <td class="name-cell">${escapeHtml(playerName(s.playerId))}</td>
        <td>${s.pj}</td><td>${s.pg}</td><td>${s.pe}</td><td>${s.pp}</td>
        <td>${s.gf}</td><td>${s.gc}</td><td>${s.gd > 0 ? "+" + s.gd : s.gd}</td>
        <td>${s.lc > 0 ? "+" + s.lc : "0"}</td>
        <td class="pts-cell">${s.pts}</td>
      </tr>`).join("");
    return `
      <div class="table-scroll">
        <table class="standings">
          <thead><tr>
            <th>#</th><th style="text-align:left">Player</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th>
            <th>GF</th><th>GC</th><th>DG</th><th>LC</th><th>Pts</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <p class="qual-note">LC = puntos extra ganados en series de penales (desempate "Leagues Cup").</p>
      ${qualifyCount > 0 ? `<p class="qual-note"><span class="qual-dot"></span>Los primeros ${qualifyCount} avanzan a la Liguilla.</p>` : ""}
    `;
  }

  /* ============================== render: jornada pane ============================== */
  // Faltas de puntualidad y consola capturadas en la matriz de la Jornada.
  function jornadaFlag(j, playerId, kind) {
    return (state.penalties || []).some(r => r.jornada_id === j.id && r.player_id === playerId && r.kind === kind && !r.waived);
  }
  // Matriz de registro: columnas = players; renglones = asistencia, puntualidad
  // y consola actualizada. Desmarcar puntualidad o consola registra la falta.
  function registerMatrixHtml(j) {
    const attendLocked = !isAdmin || j.matches.length > 0;
    const consoles = [j.console1Id, j.console2Id].filter(Boolean);
    const cell = (p, kind) => {
      const present = j.activeIds.includes(p.id);
      if (kind === "consola" && !consoles.includes(p.id)) return `<td class="na">—</td>`;
      const bad = jornadaFlag(j, p.id, kind);
      const dis = !isAdmin || !present;
      return `<td class="${!present ? "off" : bad ? "flag" : ""}"><input type="checkbox" data-action="toggle-flag" data-kind="${kind}" data-j="${j.id}" data-p="${p.id}" ${bad ? "" : "checked"} ${dis ? "disabled" : ""} title="${escapeHtml(p.name)}"></td>`;
    };
    return `
        <div class="table-scroll">
          <table class="reg-matrix">
            <thead><tr><th></th>${state.players.map(p => `<th>${escapeHtml(p.name)}</th>`).join("")}</tr></thead>
            <tbody>
              <tr><th>✅ Asistencia</th>${state.players.map(p => `<td><input type="checkbox" data-action="toggle-attendance" data-j="${j.id}" data-p="${p.id}" ${j.activeIds.includes(p.id) ? "checked" : ""} ${attendLocked ? "disabled" : ""} title="${escapeHtml(p.name)}"></td>`).join("")}</tr>
              <tr><th>⏰ Puntualidad<small>Desmarcado = llegó tarde</small></th>${state.players.map(p => cell(p, "retardo")).join("")}</tr>
              ${j.jornada_number === 0 ? "" : `<tr><th>🎮 Consola actualizada<small>${consoles.length || !isAdmin ? "Solo Consola 1 y 2" : "Asigna Consola 1 y 2 arriba"}</small></th>${state.players.map(p => cell(p, "consola")).join("")}</tr>`}
            </tbody>
          </table>
        </div>`;
  }
  async function toggleJornadaFlag(jornadaId, playerId, kind) {
    if (!isAdmin) return;
    const j = state.jornadas.find(x => x.id === jornadaId);
    if (!j || !j.activeIds.includes(playerId)) return;
    const res = jornadaFlag(j, playerId, kind)
      ? await sb.from("penalties").delete().eq("jornada_id", jornadaId).eq("player_id", playerId).eq("kind", kind)
      : await sb.from("penalties").insert({ season_id: state.season.id, jornada_id: jornadaId, player_id: playerId, kind, note: "Registrada en la " + j.label });
    if (res.error) showToast("No se pudo guardar el cambio.");
    await loadSeasonData(); render();
  }
  function renderAttendanceStage(j) {
    // La matriz de asistencia, puntualidad y consola solo la ven los admins.
    if (!isAdmin) return `<div class="empty-state">El calendario de la ${escapeHtml(j.label)} aparecerá aquí cuando el admin lo genere.</div>`;
    const enough = j.activeIds.length >= 4;
    const locked = !isAdmin;
    return `
      <div class="card">
        <h2 style="font-family:var(--font-display);font-weight:700;font-size:20px;margin:0 0 4px;">Asistencia — ${j.label}</h2>
        <p class="attend-note">Marca quiénes juegan esta Jornada (mínimo 4). Si alguien llegó tarde o llevó la consola sin los equipos actualizados, desmarca su casilla: la falta se registra en 🚨 Penalizaciones. El calendario y la Liguilla se generan según quién participe.</p>
        ${locked ? `<p class="lock-note">🔒 Solo el admin puede editar la asistencia.</p>` : ""}
        ${registerMatrixHtml(j)}
        ${!enough && !locked ? '<p class="attend-warn">Selecciona al menos 4 players.</p>' : ""}
        ${!locked ? `<button class="btn-primary" data-action="generate-jornada" data-j="${j.id}" ${enough ? "" : "disabled"} style="max-width:280px;">Generar calendario</button>` : ""}
      </div>
    `;
  }

  function renderGroupStage(j) {
    const rounds = {};
    j.matches.forEach(m => { (rounds[m.round] = rounds[m.round] || []).push(m); });
    const roundKeys = Object.keys(rounds).map(Number).sort((a, b) => a - b);
    const standings = computeStandings(j);
    const allPlayed = j.matches.every(m => m.played);
    const N = j.activeIds.length;
    const qualifyCount = N === 7 ? 6 : 4;

    return `
      <div class="section">
        <div class="section-head">
          <h2>Fase de grupos</h2>
          <span class="sub">Todos contra todos · ${j.matches.length} partidos</span>
        </div>
        ${roundKeys.map(rk => `
          <div class="round-block">
            <p class="round-label">Fecha ${rk}</p>
            ${rounds[rk].map(m => matchCardHtml(m, j.id, false)).join("")}
          </div>
        `).join("")}
      </div>
      <div class="section">
        <div class="section-head"><h2>Tabla de posiciones</h2></div>
        ${standingsTableHtml(standings, allPlayed ? qualifyCount : 0)}
        ${allPlayed && !j.playoff && isAdmin ? `<div class="gen-btn-row"><button class="btn-primary" style="width:auto;" data-action="generate-liguilla" data-j="${j.id}">Generar Liguilla →</button></div>` : ""}
        ${!allPlayed ? `<p class="qual-note">Captura todos los resultados para desbloquear la Liguilla.</p>` : ""}
      </div>
    `;
  }

  function koMatchBlock(title, m, jornadaId, rankLabel) {
    if (!m) return "";
    return `
      <div>
        <p class="round-label">${title}${rankLabel ? " · " + rankLabel : ""}</p>
        ${matchCardHtml(m, jornadaId, true)}
      </div>
    `;
  }

  function renderPlayoff(j) {
    const pf = j.playoff;
    if (!pf) return "";
    const standings = computeStandings(j);
    const rankOf = {}; standings.forEach(s => rankOf[s.playerId] = s.rank);
    const rk = (id) => "#" + rankOf[id];
    let html = `<div class="section"><div class="section-head"><h2>Liguilla de la Jornada</h2><span class="sub">${pf.type === "7" ? "Repechaje + Semifinales + Final" : "Semifinales + Final"}</span></div>`;

    if (pf.type === "7") {
      html += `<div class="bracket-stage"><p class="stage-title">Repechaje (empate en tiempo regular se va a tiempos extras y si sigue el empate se define en penales)</p>
        <div class="bracket-grid two-col">
          ${koMatchBlock("3° vs 6°", pf.repechaje[0], j.id)}
          ${koMatchBlock("4° vs 5°", pf.repechaje[1], j.id)}
        </div></div>`;
    }
    if (pf.semis.length === 2) {
      html += `<div class="bracket-stage"><p class="stage-title">Semifinales</p>
        <div class="bracket-grid two-col">
          ${koMatchBlock("Semifinal 1", pf.semis[0], j.id, rk(pf.semis[0].homeId) + " vs " + rk(pf.semis[0].awayId))}
          ${koMatchBlock("Semifinal 2", pf.semis[1], j.id, rk(pf.semis[1].homeId) + " vs " + rk(pf.semis[1].awayId))}
        </div></div>`;
    } else if (pf.type === "7") {
      html += `<p class="qual-note">Las semifinales se arman cuando termine el Repechaje.</p>`;
    }
    if (pf.final) {
      html += `<div class="bracket-stage"><p class="stage-title">Final</p>${matchCardHtml(pf.final, j.id, true)}</div>`;
    } else if (pf.semis.length === 2) {
      html += `<p class="qual-note">La Final se arma cuando terminen las Semifinales.</p>`;
    }
    if (pf.championId) {
      html += `<div class="champion-banner">
        <span class="trophy">🏆</span>
        <div class="label">Campeón de la ${j.label}</div>
        <div class="name">${escapeHtml(playerName(pf.championId))}</div>
      </div>`;
    }
    html += `</div>`;
    return html;
  }

  function jornadaStatus(j) {
    if (j.matches.length === 0) return "pending";
    if (j.playoff && j.playoff.championId) return "done";
    return "progress";
  }

  /* ============================== render: palmares ============================== */
  function renderPalmares() {
    const titles = {};
    state.players.forEach(p => titles[p.id] = 0);
    const champs = state.jornadas.map(j => {
      const champ = j.playoff && j.playoff.championId;
      if (champ) titles[champ] = (titles[champ] || 0) + 1;
      return { label: j.label, champ };
    });
    const board = state.players.slice().sort((a, b) => titles[b.id] - titles[a.id]);
    return `
      <div class="section">
        <div class="section-head"><h2>Palmarés de la temporada</h2></div>
        <div class="palm-grid">
          ${champs.map(c => `
            <div class="palm-card ${c.champ ? "" : "empty"}">
              <div class="j">${c.label}</div>
              <div class="tr">${c.champ ? "🏆" : "—"}</div>
              <div class="who">${c.champ ? escapeHtml(playerName(c.champ)) : "Pendiente"}</div>
            </div>`).join("")}
        </div>
        <div class="leaderboard card">
          <h2 style="font-family:var(--font-display);font-weight:700;font-size:18px;margin:0 0 6px;">Títulos por player</h2>
          ${board.map((p, i) => `
            <div class="lb-row">
              <span class="rk">${i + 1}</span>
              <span class="nm">${escapeHtml(p.name)}</span>
              <span class="ct">${titles[p.id]}</span>
            </div>`).join("")}
        </div>
      </div>
    `;
  }

  /* ============================== render: help + login modals ============================== */
  /* ============================== recompensas ============================== */
  const REWARD_POINTS = [11, 10, 9, 8, 7, 6, 5]; // 1° a 7° de la fase de grupos
  const ABSENT_POINTS = 2;
  const CHAMPION_BONUS = 2;
  const RUNNER_UP_BONUS = 1;
  // FIFA Coins (ϝ) al final de cada Jornada: fila = lugar en la Tabla General
  // (o "faltó"), columna = distancia en puntos con el 1° lugar.
  const FC_DIST_LABELS = ["0 a 6", "7 a 12", "13 a 18", "19 a 24", "25 a 30", "31+"];
  const FC_TABLE = [
    [16, 16, 16, 16, 16, 16], // 1°
    [17, 19, 21, 23, 25, 27], // 2°
    [18, 20, 22, 24, 26, 28], // 3°
    [20, 21, 23, 25, 27, 29], // 4°
    [21, 23, 25, 27, 29, 31], // 5°
    [23, 25, 27, 29, 31, 33], // 6°
    [24, 26, 28, 30, 32, 34]  // 7°
  ];
  const FC_ABSENT = [10, 12, 14, 16, 18, 20];
  function fcDistanceBucket(d) {
    return d <= 6 ? 0 : Math.min(5, Math.ceil((d - 6) / 6));
  }
  function fifaCoins(rank, distance, absent) {
    const col = fcDistanceBucket(distance);
    if (absent) return FC_ABSENT[col];
    return FC_TABLE[Math.min(rank, FC_TABLE.length) - 1][col];
  }

  function groupStageDone(j) {
    return j.matches.length > 0 && j.matches.every(m => m.played);
  }
  // Puntos de recompensa de una Jornada. null si la fase de grupos no ha terminado.
  function jornadaRewards(j) {
    if (!groupStageDone(j)) return null;
    const pf = j.playoff;
    const championId = pf && pf.championId ? pf.championId : null;
    const runnerUpId = championId && pf.final
      ? (pf.final.homeId === championId ? pf.final.awayId : pf.final.homeId)
      : null;
    const rows = [];
    computeStandings(j).forEach(s => rows.push({
      playerId: s.playerId, place: s.rank,
      base: REWARD_POINTS[s.rank - 1] != null ? REWARD_POINTS[s.rank - 1] : REWARD_POINTS[REWARD_POINTS.length - 1]
    }));
    state.players.forEach(p => {
      if (!j.activeIds.includes(p.id)) rows.push({ playerId: p.id, place: null, base: ABSENT_POINTS });
    });
    const order = {}; state.players.forEach((p, i) => order[p.id] = i);
    rows.forEach(r => {
      r.champion = r.playerId === championId ? CHAMPION_BONUS : 0;
      r.runnerUp = r.playerId === runnerUpId ? RUNNER_UP_BONUS : 0;
      r.total = r.base + r.champion + r.runnerUp;
    });
    rows.sort((a, b) => b.total - a.total
      || (a.place == null ? 99 : a.place) - (b.place == null ? 99 : b.place)
      || order[a.playerId] - order[b.playerId]);
    return { rows, finalDone: !!championId };
  }
  // Tabla General: acumulado Jornada tras Jornada. En empate, quien venía
  // abajo y alcanza a otro se coloca arriba de él; si ya estaban empatados,
  // conservan su orden. En la J0 el empate se define por el lugar en su fase regular.
  function generalTable() {
    let order = state.players.map(p => p.id);
    const total = {}, perJ = {}, penJ = {};
    order.forEach(id => { total[id] = 0; perJ[id] = {}; penJ[id] = {}; });
    const pen = penaltiesByJornada();
    const labels = [];
    const snapshots = {};
    let prevRank = null;
    state.jornadas.forEach(j => {
      const r = jornadaRewards(j);
      if (!r) return;
      // Primera Jornada contada (la J0): no hay tabla previa, así que el
      // desempate es el lugar en la fase regular de esa Jornada (sin Liguilla).
      if (!labels.length) {
        const place = {}; r.rows.forEach(row => place[row.playerId] = row.place == null ? 99 : row.place);
        const reg = {}; order.forEach((id, i) => reg[id] = i);
        order = order.slice().sort((a, b) => (place[a] ?? 99) - (place[b] ?? 99) || reg[a] - reg[b]);
      }
      labels.push(j.label);
      const before = Object.assign({}, total);
      const pos = {}; order.forEach((id, i) => pos[id] = i);
      prevRank = pos;
      r.rows.forEach(row => {
        if (!(row.playerId in total)) return;
        // Las penalizaciones restan en la Jornada de la falta (puede quedar en negativo).
        const minus = (pen[j.id] && pen[j.id][row.playerId] || {}).pts || 0;
        total[row.playerId] += row.total - minus;
        perJ[row.playerId][j.label] = row.total - minus;
        if (minus) penJ[row.playerId][j.label] = minus;
      });
      order = order.slice().sort((a, b) => total[b] - total[a] || before[a] - before[b] || pos[a] - pos[b]);
      const rank = {}; order.forEach((id, i) => rank[id] = i + 1);
      snapshots[j.label] = { rank, total: Object.assign({}, total), leaderTotal: total[order[0]] };
    });
    return {
      labels, snapshots,
      rows: order.map((id, i) => ({
        playerId: id, rank: i + 1, total: total[id], perJ: perJ[id], penJ: penJ[id],
        move: labels.length > 1 ? prevRank[id] - i : 0
      }))
    };
  }

  // FC de un jugador en una Jornada. Se reparten con la Tabla General al final
  // de la Jornada (incluye el bono de su Final), así que esperan a la Final.
  function jornadaFifaCoins(j, r, snaps, row) {
    if (!r.finalDone) return null;
    const snap = snaps[j.label];
    return fifaCoins(snap.rank[row.playerId], snap.leaderTotal - snap.total[row.playerId], row.place == null);
  }

  /* ============================== equipos y mercado ============================== */
  const INITIAL_BUDGET = 1000;
  const SQUAD_SIZE = 14;
  const WF_BONUS = { 3: 1, 4: 2, 5: 4 };
  const SM_BONUS = { 3: 1, 4: 2, 5: 5 };
  function cardPrice(rat, wf, sm) {
    return rat + (WF_BONUS[wf] || 0) + (SM_BONUS[sm] || 0);
  }
  // ϝ dibujada como SVG: las fuentes no incluyen este carácter y cada sistema
  // lo mostraba distinto (en Windows parecía una F). fcPlain es para avisos
  // y confirmaciones del navegador, que solo aceptan texto.
  const FC_SYM = '<svg class="fc-sym" viewBox="0 0 10 14" role="img" aria-label="ϝ"><path d="M3.1 13.2C3.3 9.6 3.8 6.6 4.9 4.6 5.8 3 7.1 2.2 8.7 2.6"/><path d="M1.8 8.3 7.4 7.6"/></svg>';
  // Cantidades de ϝ: enteras sin decimales; con fracción, 2 decimales.
  function fcNumber(n) {
    const a = Math.abs(n);
    return Number.isInteger(Math.round(a * 100) / 100) ? String(Math.round(a)) : a.toFixed(2);
  }
  function fcFormatted(n) { return (n < 0 ? "−" : "") + FC_SYM + fcNumber(n); }
  function fcPlain(n) { return (n < 0 ? "−ϝ" : "ϝ") + fcNumber(n); }

  // Saldo de cada participante: presupuesto inicial + FC ganadas - compras.
  function teamFinances() {
    const snaps = generalTable().snapshots;
    const fin = {};
    state.players.forEach(p => fin[p.id] = { earned: 0, spent: 0, refunded: 0, count: 0 });
    state.jornadas.forEach(j => {
      const r = jornadaRewards(j);
      if (!r) return;
      r.rows.forEach(row => {
        const fc = jornadaFifaCoins(j, r, snaps, row);
        if (fc != null && fin[row.playerId]) fin[row.playerId].earned += fc;
      });
    });
    (state.purchases || []).forEach(pu => {
      const f = fin[pu.player_id];
      if (!f) return;
      f.spent += pu.price;
      if (pu.sold_at) f.refunded += Number(pu.sale_amount) || 0;
      else f.count++;
    });
    Object.values(fin).forEach(f => f.balance = Math.round((INITIAL_BUDGET + f.earned - f.spent + f.refunded) * 100) / 100);
    return fin;
  }


  // Turno del Draft inicial: snake según la Tabla General al terminar J0,
  // empezando por el último lugar. Solo informativo (no se fuerza).
  // Turno de un Draft snake: orden según la Tabla General al terminar la
  // Jornada `orderLabel`, empezando por el último lugar. Cada compra hecha en
  // ese Draft o turno pasado consume un turno de ese equipo.
  function draftState(key, orderLabel, rounds) {
    const snap = generalTable().snapshots[orderLabel];
    const order = state.players.map(p => p.id).sort((a, b) => snap.rank[a] - snap.rank[b]);
    const n = order.length;
    const total = n * rounds;
    const reversed = order.slice().reverse();
    const turnAt = k => (Math.floor(k / n) % 2 === 0 ? reversed : order)[k % n];
    const have = {}, need = {};
    order.forEach(id => { have[id] = 0; need[id] = 0; });
    (state.purchases || []).forEach(pu => { if (pu.draft === key && pu.player_id in have) have[pu.player_id]++; });
    (state.passes || []).forEach(ps => { if (ps.draft === key && ps.player_id in have) have[ps.player_id]++; });
    // Turnos perdidos por penalización: cuentan como pases automáticos de sus primeros turnos.
    const lost = {};
    const penJ = key === "initial" ? state.jornadas[0] : state.jornadas.find(j => j.label === key);
    const penMap = penJ ? (penaltiesByJornada()[penJ.id] || {}) : {};
    Object.entries(penMap).forEach(([id, x]) => {
      if (x.picks && id in have) { lost[id] = Math.min(x.picks, rounds); have[id] += lost[id]; }
    });
    const picks = Object.values(have).reduce((a, b) => a + Math.min(b, rounds), 0);
    if (picks >= total) return null;
    let turn = -1, next = null;
    for (let k = 0; k < total; k++) {
      const id = turnAt(k);
      need[id]++;
      if (have[id] < need[id]) {
        if (turn < 0) { turn = k; have[id]++; }
        else { next = id; break; }
      }
    }
    return { round: Math.floor(turn / n) + 1, rounds, pick: picks + 1, total, playerId: turnAt(turn), nextId: next, lost };
  }

  // Cierre del Mercado: domingo 11:59 pm (centro de México, UTC-6) previo a la
  // fecha de la Jornada. Si la Jornada cae en domingo, es el domingo anterior.
  function marketCloseAt(playDate) {
    if (!playDate) return null;
    const [y, m, d] = playDate.split("-").map(Number);
    const day = new Date(Date.UTC(y, m - 1, d));
    const dow = day.getUTCDay();
    const back = dow === 0 ? 7 : dow;
    // 23:59:59 en UTC-6 = 05:59:59 UTC del lunes siguiente a ese domingo
    return new Date(Date.UTC(y, m - 1, d - back + 1, 5, 59, 59));
  }
  const JORNADA_DRAFT_ROUNDS = 2; // una vuelta snake: ida y vuelta

  // Fase actual del Mercado:
  //  waiting  → aún no termina J0
  //  draft    → Draft inicial (tras J0) o Draft de la Jornada (tras J1..J10)
  //  open     → cualquiera compra/vende, hasta el domingo previo a la siguiente Jornada
  //  closed   → desde ese domingo hasta que termina la Jornada, o fin de temporada
  // Desbloqueo por RAT: tras la J0 se puede comprar hasta RAT 84; cada Jornada
  // terminada sube el límite 1 punto (J1 → 85 … J7 → 91) y desde la J8 no hay
  // límite. El límite vale para el Draft y el Mercado abierto que siguen a esa Jornada.
  const RAT_UNLOCK_BASE = 84;
  const RAT_UNLOCK_FREE_FROM = 8;
  function lastFinishedIndex() {
    let last = -1;
    state.jornadas.forEach((j, i) => { const r = jornadaRewards(j); if (r && r.finalDone) last = i; });
    return last;
  }
  function ratCap() {
    const k = Math.max(0, lastFinishedIndex());
    return k >= RAT_UNLOCK_FREE_FROM ? Infinity : RAT_UNLOCK_BASE + k;
  }
  // Jornada en la que se desbloquea un jugador según su RAT.
  function unlockLabel(rat) {
    const k = Math.min(RAT_UNLOCK_FREE_FROM, Math.max(0, rat - RAT_UNLOCK_BASE));
    return "J" + k;
  }
  function unlockNote() {
    const cap = ratCap();
    if (cap === Infinity) return "Todos los jugadores están desbloqueados.";
    const next = cap + 1;
    const nextTxt = unlockLabel(next) === "J" + RAT_UNLOCK_FREE_FROM
      ? "el resto se desbloquea al terminar la J" + RAT_UNLOCK_FREE_FROM
      : "RAT " + next + " se desbloquea al terminar la " + unlockLabel(next);
    return "Desbloqueados: RAT " + cap + " o menos; " + nextTxt + ".";
  }
  function marketStatus() {
    let last = -1;
    state.jornadas.forEach((j, i) => { const r = jornadaRewards(j); if (r && r.finalDone) last = i; });
    if (last < 0) return { phase: "waiting" };
    const initial = draftState("initial", state.jornadas[0].label, SQUAD_SIZE);
    if (initial) return { phase: "draft", key: "initial", title: "Draft inicial", canPass: true, ...initial };
    const lastJ = state.jornadas[last];
    if (last >= 1 && last <= state.jornadas.length - 2) {
      const d = draftState(lastJ.label, lastJ.label, JORNADA_DRAFT_ROUNDS);
      if (d) return { phase: "draft", key: lastJ.label, title: "Draft de la " + lastJ.label, canPass: true, ...d };
    }
    const nextJ = state.jornadas[last + 1];
    if (!nextJ) return { phase: "closed", reason: "season" };
    const closeAt = marketCloseAt(nextJ.playDate);
    if (closeAt && Date.now() > closeAt.getTime()) return { phase: "closed", reason: "deadline", nextLabel: nextJ.label };
    return { phase: "open", closeAt, nextLabel: nextJ.label };
  }
  function marketAllowsTrades(st) { return st.phase === "draft" || st.phase === "open"; }
  function formatCloseAt(d) {
    return d.toLocaleString("es-MX", { timeZone: "America/Mexico_City", weekday: "long", day: "numeric", month: "long", hour: "numeric", minute: "2-digit" });
  }


  function normalizeText(t) {
    return String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  }
  function loadMarket() {
    if (market || marketLoading) return;
    marketLoading = true; marketError = false;
    fetch("market.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
      const idx = {}; d.cols.forEach((c, i) => idx[c] = i);
      market = d.rows.map(row => {
        const o = {}; d.cols.forEach((c, i) => o[c] = row[i]);
        o.price = cardPrice(o.rat, o.wf, o.sm);
        o.search = normalizeText(o.name);
        return o;
      });
      market.byId = {}; market.forEach(m => market.byId[m.id] = m);
      marketLoading = false; render();
    }).catch(() => { marketLoading = false; marketError = true; render(); });
  }

  function rewardsLegendHtml() {
    const places = REWARD_POINTS.map((p, i) => `${i + 1}° = ${p}`).join(" · ");
    return `<p class="qual-note">Puntos por lugar en la fase de grupos: ${places} · Faltó = ${ABSENT_POINTS}. Bono de la Final: Campeón +${CHAMPION_BONUS}, Subcampeón +${RUNNER_UP_BONUS}.</p>`;
  }
  function renderRewards() {
    const done = state.jornadas.map(j => ({ j, r: jornadaRewards(j) })).filter(x => x.r).reverse();
    const snaps = generalTable().snapshots;
    const fcOf = (j, r, row) => jornadaFifaCoins(j, r, snaps, row);
    let html = `<div class="section">
      <div class="section-head"><h2>Recompensas</h2><span class="sub">Puntos por Jornada</span></div>
      ${rewardsLegendHtml()}
      <p class="qual-note">Camp. = Campeón · Subc. = Subcampeón. FC (${FC_SYM}): FIFA Coins según el lugar en la Tabla General al final de la Jornada y la distancia en puntos con el 1° (ver tabla en ℹ️ Reglas).</p>`;
    if (!done.length) {
      html += `<div class="card empty-note">Todavía no hay Jornadas con la fase de grupos terminada. Los puntos aparecen aquí en cuanto se capturen todos los partidos de una Jornada.</div>`;
    }
    const pen = penaltiesByJornada();
    done.forEach(({ j, r }) => {
      const pj = pen[j.id] || {};
      const hasPen = Object.values(pj).some(x => x.pts);
      html += `<div class="rewards-block">
        <p class="stage-title">${j.label}${r.finalDone ? "" : ` <span class="sub-note">· bonos de la Final y FC pendientes</span>`}</p>
        <div class="table-scroll">
          <table class="standings compact">
            <thead><tr>
              <th style="text-align:left">Player</th><th>Lugar</th><th>Pts</th><th title="Campeón">Camp.</th><th title="Subcampeón">Subc.</th>${hasPen ? `<th title="Puntos restados por penalizaciones">Penalización</th>` : ""}<th>Total</th><th>FC (${FC_SYM})</th>
            </tr></thead>
            <tbody>${r.rows.map(row => `
              <tr class="${row.place == null ? "absent" : ""}">
                <td class="name-cell">${escapeHtml(playerName(row.playerId))}</td>
                <td>${row.place == null ? "Faltó" : row.place + "°"}</td>
                <td>${row.base}</td>
                <td>${row.champion ? `🏆+${row.champion}` : ""}</td>
                <td>${row.runnerUp ? `🥈+${row.runnerUp}` : ""}</td>
                ${hasPen ? `<td>${pj[row.playerId] && pj[row.playerId].pts ? `<span class="pen-neg">−${pj[row.playerId].pts}</span>` : ""}</td>` : ""}
                <td class="pts-cell">${row.total - ((pj[row.playerId] || {}).pts || 0)}</td>
                <td class="fc-cell">${(fc => fc == null ? "–" : fcFormatted(fc))(fcOf(j, r, row))}</td>
              </tr>`).join("")}
            </tbody>
          </table>
        </div>
      </div>`;
    });
    return html + `</div>`;
  }
  function renderGeneralTable() {
    const g = generalTable();
    let html = `<div class="section">
      <div class="section-head"><h2>Tabla General</h2></div>`;
    if (!g.labels.length) {
      html += `<div class="card empty-note">La Tabla General se arma en cuanto termine la fase de grupos de la primera Jornada.</div></div>`;
      return html;
    }
    const arrow = (m) => m > 0 ? `<span class="mv up">▲${m}</span>` : m < 0 ? `<span class="mv down">▼${-m}</span>` : `<span class="mv">–</span>`;
    html += `<div class="table-scroll">
        <table class="standings compact">
          <thead><tr>
            <th>#</th><th></th><th style="text-align:left">Player</th>
            ${g.labels.map(l => `<th>${l}</th>`).join("")}
            <th>Total</th>
          </tr></thead>
          <tbody>${g.rows.map(r => `
            <tr>
              <td class="pos-cell">${r.rank}</td>
              <td>${arrow(r.move)}</td>
              <td class="name-cell">${escapeHtml(playerName(r.playerId))}</td>
              ${g.labels.map(l => `<td>${r.perJ[l] != null ? r.perJ[l] : "–"}${r.penJ[l] ? `<span class="pen-mark" title="Incluye −${r.penJ[l]} por penalización">−${r.penJ[l]}</span>` : ""}</td>`).join("")}
              <td class="pts-cell">${r.total}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
      ${g.rows.some(r => Object.keys(r.penJ).length) ? `<p class="qual-note"><span class="pen-mark" style="margin:0">−N</span> = puntos restados por penalizaciones en esa Jornada (ya descontados; ver 🚨 Penalizaciones).</p>` : ""}
      <p class="qual-note">Las flechas indican el movimiento respecto a la Jornada anterior. En empate de puntos, quien venía abajo y alcanza a otro player se coloca arriba de él (en la J0, el empate lo define el lugar en su fase regular).</p>
      ${generalChartHtml(g)}
    </div>`;
    return html;
  }

  /* ---------- gráfica de evolución de la Tabla General ---------- */
  // Color fijo por jugador (orden de registro), nunca por posición en la tabla.
  function seriesVar(playerId) {
    const i = state.players.findIndex(p => p.id === playerId);
    return "var(--series-" + ((i % 8) + 1) + ")";
  }
  function chartWidth() {
    const vw = window.innerWidth || 1024;
    // Ancho útil dentro de la tarjeta (contenido del módulo menos el relleno de la tarjeta).
    const content = vw >= 900 ? Math.min(920, vw - 200) - 36 : vw - 36;
    return Math.max(280, Math.min(884, content) - 16);
  }
  function generalChartHtml(g) {
    const labels = g.labels;
    const players = state.players;
    // Lugar en la Tabla General tras cada Jornada: 1° arriba, último junto al eje X.
    const N = Math.max(2, players.length);
    const cum = players.map(p => ({ id: p.id, pts: labels.map(l => g.snapshots[l].rank[p.id] || N) }));
    const W = chartWidth(), H = W < 560 ? 280 : 340;
    const narrow = W < 560;
    const m = { top: 14, right: narrow ? 66 : 96, bottom: 30, left: 36 };
    const iw = W - m.left - m.right, ih = H - m.top - m.bottom;
    // Eje X con todas las Jornadas de la temporada (J0 a la izquierda); las
    // líneas avanzan conforme se terminan. xi = índice de la Jornada en la temporada.
    const allLabels = state.jornadas.map(j => j.label);
    const slots = Math.max(1, allLabels.length - 1);
    const xAt = k => m.left + (iw * k) / slots;
    const colIdx = labels.map(l => allLabels.indexOf(l));
    const x = i => xAt(colIdx[i]);
    const y = rank => m.top + (ih * (rank - 1)) / (N - 1);
    const ticks = Array.from({ length: N }, (_, i) => i + 1);
    // Etiquetas al final de cada línea, separadas para que no se encimen.
    const lastIdx = labels.length - 1;
    const ends = cum.map(c => ({ id: c.id, v: c.pts[lastIdx], y: y(c.pts[lastIdx]) })).sort((a, b) => a.y - b.y);
    const gap = 14;
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < gap) ends[i].y = ends[i - 1].y + gap;
    const overflow = ends.length ? ends[ends.length - 1].y - (m.top + ih) : 0;
    if (overflow > 0) ends.forEach(e => e.y -= overflow);
    for (let i = ends.length - 2; i >= 0; i--) if (ends[i + 1].y - ends[i].y < gap) ends[i].y = ends[i + 1].y - gap;
    const colW = iw / slots;
    const shortName = n => narrow && n.length > 8 ? n.slice(0, 7) + "…" : n;
    return `
      <div class="gt-chart card">
        <div class="gt-chart-head">
          <h3>Evolución de posiciones</h3>
          <div class="gt-legend">${players.map(p => `<span class="gt-leg"><i style="background:${seriesVar(p.id)}"></i>${escapeHtml(p.name)}</span>`).join("")}</div>
        </div>
        <div class="gt-wrap" id="gt-wrap">
          <svg class="gt-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lugar en la Tabla General de cada player después de cada Jornada">
            ${ticks.map(t => `<line class="gt-grid" x1="${m.left}" x2="${m.left + iw}" y1="${y(t)}" y2="${y(t)}"/><text class="gt-ytick" x="${m.left - 8}" y="${y(t) + 4}">${t}°</text>`).join("")}
            ${allLabels.map((l, k) => `<text class="gt-xtick ${labels.includes(l) ? "" : "pending"}" x="${xAt(k)}" y="${H - 8}">${l}</text>`).join("")}
            <line class="gt-cross" id="gt-cross" x1="0" x2="0" y1="${m.top}" y2="${m.top + ih}" style="display:none"/>
            ${cum.map(c => `
              <polyline class="gt-line" points="${c.pts.map((v, i) => x(i) + "," + y(v)).join(" ")}" style="stroke:${seriesVar(c.id)}"/>
              ${c.pts.map((v, i) => `<circle class="gt-dot" cx="${x(i)}" cy="${y(v)}" r="4" style="fill:${seriesVar(c.id)}"/>`).join("")}`).join("")}
            ${ends.map(e => `<text class="gt-end" x="${x(lastIdx) + 10}" y="${e.y + 4}"><tspan style="fill:${seriesVar(e.id)}">●</tspan> ${escapeHtml(shortName(playerName(e.id)))} <tspan class="gt-end-v">${e.v}°</tspan></text>`).join("")}
            ${labels.map((l, i) => `<rect class="gt-hit" data-idx="${i}" x="${x(i) - colW / 2}" y="${m.top}" width="${colW}" height="${ih}"/>`).join("")}
          </svg>
          <div class="gt-tip" id="gt-tip" style="display:none"></div>
        </div>
      </div>`;
  }
  function showChartTip(idx) {
    const g = generalTable();
    const l = g.labels[idx];
    const wrap = $("#gt-wrap"), tip = $("#gt-tip"), cross = $("#gt-cross"), hit = wrap && wrap.querySelector('.gt-hit[data-idx="' + idx + '"]');
    if (!wrap || !tip || !hit) return;
    const cx = parseFloat(hit.getAttribute("x")) + parseFloat(hit.getAttribute("width")) / 2;
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.style.display = "";
    const rows = state.players.map(p => ({ id: p.id, v: g.snapshots[l].total[p.id] || 0, rank: g.snapshots[l].rank[p.id] })).sort((a, b) => a.rank - b.rank);
    tip.innerHTML = `<div class="gt-tip-h">Después de la ${l}</div>` + rows.map(r =>
      `<div class="gt-tip-r"><i style="background:${seriesVar(r.id)}"></i><span>${r.rank}° ${escapeHtml(playerName(r.id))}</span><strong>${r.v} pts</strong></div>`).join("");
    tip.style.display = "";
    const W = wrap.clientWidth, tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(W - tw, cx + 12 > W - tw ? cx - tw - 12 : cx + 12)) + "px";
  }
  function hideChartTip() {
    const tip = $("#gt-tip"), cross = $("#gt-cross");
    if (tip) tip.style.display = "none";

  /* ============================== premios ============================== */
  // Premio (+) o pago (−) en pesos por lugar final en Puntos Generales.
  const PRIZES = [1600, 1000, 500, -100, -200, -300, -400];
  const PRIZE_LABELS = ["Campeón", "2° lugar", "3° lugar", "4° lugar", "5° lugar", "6° lugar", "7° lugar"];
  function moneyText(n) {
    const a = Math.abs(n);
    return (n < 0 ? "−" : n > 0 ? "+" : "") + "$" + a.toLocaleString("es-MX", { minimumFractionDigits: Number.isInteger(a) ? 0 : 2, maximumFractionDigits: 2 }) + " MXP";
  }
  function moneyHtml(n) {
    return `<span class="${n < 0 ? "prize-neg" : "prize-pos"}">${n < 0 ? "Paga " : "Gana "}${moneyText(Math.abs(n)).slice(1)}</span>`;
  }
  function seasonFinished() {
    const last = state.jornadas[state.jornadas.length - 1];
    const r = last && jornadaRewards(last);
    return !!(r && r.finalDone);
  }
  // Lugares finales: por Puntos Generales (sin el desempate de la Tabla General).
  // Empate en el 1°: Final Magna (2 players) o Mini Torneo Magno (3 o más), cuyo
  // resultado captura el admin. Empate en otro lugar: se suman los premios de los
  // lugares que ocupan y se dividen en partes iguales.
  function prizeStandings() {
    const g = generalTable();
    const rows = g.rows.slice();
    const groups = [];
    rows.forEach(r => {
      const last = groups[groups.length - 1];
      if (last && last.total === r.total) last.rows.push(r); else groups.push({ total: r.total, rows: [r] });
    });
    const out = [];
    let pos = 0, magna = null;
    groups.forEach((gr, gi) => {
      const n = gr.rows.length;
      if (gi === 0 && n > 1) {
        const ids = gr.rows.map(r => r.playerId);
        const order = state.season.magna_order || [];
        const valid = order.length === n && ids.every(id => order.includes(id));
        magna = { ids, type: n === 2 ? "Final Magna" : "Mini Torneo Magno", decided: valid };
        if (valid) {
          order.forEach((id, k) => out.push({ playerId: id, total: gr.total, place: k + 1, amount: PRIZES[k] || 0, magna: true }));
        } else {
          gr.rows.forEach(r => out.push({ playerId: r.playerId, total: gr.total, place: 1, placeTo: n, amount: null, magna: true }));
        }
      } else if (n > 1) {
        const sum = PRIZES.slice(pos, pos + n).reduce((a, b) => a + b, 0);
        gr.rows.forEach(r => out.push({ playerId: r.playerId, total: gr.total, place: pos + 1, placeTo: pos + n, amount: Math.round(sum / n * 100) / 100, tie: true }));
      } else {
        out.push({ playerId: gr.rows[0].playerId, total: gr.total, place: pos + 1, amount: PRIZES[pos] || 0 });
      }
      pos += n;
    });
    return { rows: out, magna, any: g.labels.length > 0 };
  }
  function renderPrizesModule() {

    const rules = `<div class="card prize-rules" style="padding:16px 18px;">

        <p><strong>Empate en otro lugar:</strong> se suman los premios de ese lugar y del (o los) siguiente(s) y se dividen en partes iguales entre los players empatados.</p>
