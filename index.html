  async function saveMagna(clear) {
    if (!isAdmin) return;
    let order = null;
    if (!clear) {
      order = $all(".magna-select").sort((a, b) => a.dataset.k - b.dataset.k).map(x => x.value);
      magnaDraft = order;
      if (order.some(v => !v) || new Set(order).size !== order.length) { showToast("Elige un player distinto para cada lugar."); return; }
    }

    if (error) { showToast("No se pudo guardar el resultado."); return; }

  /* ============================== penalizaciones ============================== */
  // Cada tipo de falta lleva su propio conteo. `free` = faltas de tolerancia
  // sin penalización; después: 1ª penalizada −2 pts y 1 turno, siguientes −3 y 2.
  const PEN_KINDS = {
    consola: { icon: "🎮", label: "Consola desactualizada", short: "Consola", free: 0 },
    alineacion: { icon: "📋", label: "Alineación", short: "Alineación", free: 1 },
    retardo: { icon: "⏰", label: "Impuntualidad", short: "Retardos", free: 2 }
  };
  const PEN_STEPS = [{ pts: 2, picks: 1 }, { pts: 3, picks: 2 }];
  function sanctionFor(kind, n) {
    const k = n - PEN_KINDS[kind].free;
    if (k <= 0) return { pts: 0, picks: 0, tolerance: true };
    return PEN_STEPS[Math.min(k, PEN_STEPS.length) - 1];
  }
  function draftAfter(j) {
    const idx = state.jornadas.indexOf(j);
    if (idx === 0) return "Draft inicial";
    if (idx >= 1 && idx <= state.jornadas.length - 2) return "Draft de la " + j.label;
    return null; // la última Jornada no tiene Draft después
  }
  function sanctionText(sc, j) {
    if (sc.tolerance) return "tolerancia, sin penalización";
    const d = draftAfter(j);
    const turns = d ? " y pierde " + (sc.picks === 1 ? "su 1er turno" : "sus " + sc.picks + " turnos") + " del " + d : " (no hay Draft después)";
    return "−" + sc.pts + " pts en la Tabla General" + turns;
  }
  function autoLineupReason(j, playerId) {
    const l = lineupOf(j.id, playerId);
    if (l && l.submitted_at && !l.late) return null;
    if (l && l.submitted_at) return "la subió tarde";
    if (l && (l.code || l.starters_path || l.bench_path)) return "la dejó incompleta";
    return "no la subió";
  }
  // Todas las faltas de la temporada, numeradas por player y tipo en orden de Jornada.
  // Las de alineación se detectan solas al cerrar el plazo; el admin puede
  // quitarlas (fila waived) o registrar otras a mano (p. ej. código equivocado).
  function penaltyFaults() {
    const rows = state.penalties || [];
    const jIdx = {}; state.jornadas.forEach((j, i) => jIdx[j.id] = i);
    const faults = [], waived = [];
    // En la J0 se juega con los equipos estándar del FIFA: no hay falta de consola.
    rows.filter(r => !r.waived && jIdx[r.jornada_id] != null && !(r.kind === "consola" && state.jornadas[jIdx[r.jornada_id]].jornada_number === 0)).forEach(r => faults.push({
      key: r.id, row: r, auto: false, kind: r.kind, playerId: r.player_id,
      jornada: state.jornadas[jIdx[r.jornada_id]], note: r.note || "", at: r.created_at
    }));
    const now = Date.now();
    state.jornadas.forEach(j => {
      if (j.jornada_number < 1) return;
      const dl = lineupDeadline(j.playDate);
      if (!dl || now < dl.getTime()) return;
      state.players.forEach(p => {
        // Quien faltó a la Jornada no juega, así que no se le exige alineación.
        if (j.matches.length && !j.activeIds.includes(p.id)) return;
        const reason = autoLineupReason(j, p.id);
        if (!reason) return;
        if (rows.some(r => r.kind === "alineacion" && !r.waived && r.jornada_id === j.id && r.player_id === p.id)) return;
        const f = { key: "auto:" + j.id + ":" + p.id, auto: true, kind: "alineacion", playerId: p.id, jornada: j, note: "Automática: " + reason, at: dl.toISOString() };
        const w = rows.find(r => r.kind === "alineacion" && r.waived && r.jornada_id === j.id && r.player_id === p.id);
        if (w) waived.push(Object.assign(f, { row: w })); else faults.push(f);
      });
    });
    faults.sort((a, b) => jIdx[a.jornada.id] - jIdx[b.jornada.id] || (a.at || "").localeCompare(b.at || ""));
    const count = {};
    faults.forEach(f => {
      const k = f.playerId + "|" + f.kind;
      count[k] = (count[k] || 0) + 1;
      f.n = count[k];
      f.sanction = sanctionFor(f.kind, f.n);
    });
    return { active: faults, waived, count };
  }
  // Penalización total por Jornada y player: puntos sumados, turnos (máx. 2).
  function penaltiesByJornada() {
    const out = {};
    penaltyFaults().active.forEach(f => {
      const m = out[f.jornada.id] = out[f.jornada.id] || {};
      const x = m[f.playerId] = m[f.playerId] || { pts: 0, picks: 0 };
      x.pts += f.sanction.pts;
      x.picks = Math.min(JORNADA_DRAFT_ROUNDS, x.picks + f.sanction.picks);
    });
    return out;
  }
  function nextSanctionText(kind, done) {
    const sc = sanctionFor(kind, done + 1);
    if (sc.tolerance) {
      const left = PEN_KINDS[kind].free - done;
      return left === 1 ? "Le queda 1 sin penalización" : "Le quedan " + left + " sin penalización";
    }
    return "Próxima: −" + sc.pts + " pts y " + sc.picks + (sc.picks === 1 ? " turno" : " turnos");
  }

    const played = state.jornadas.filter(j => j.matches.length);
    return (played.length ? played[played.length - 1] : state.jornadas[0]).id;
  }

  async function waivePenalty(jornadaId, playerId) {

  /* ============================== estadísticas ============================== */
  // Partidos jugados de la temporada según el filtro: "group" (fase de grupos),
  // "ko" (Liguilla: repechaje, semifinales y final) o "all".
  function statMatches(filter) {
    const out = [];
    state.jornadas.forEach(j => {
      if (filter !== "ko") (j.matches || []).forEach(m => out.push(m));
      if (filter !== "group" && j.playoff) {
        (j.playoff.repechaje || []).concat(j.playoff.semis || [], j.playoff.final ? [j.playoff.final] : []).forEach(m => out.push(m));
      }
    });
    return out.filter(m => m && m.played && m.homeGoals != null && m.awayGoals != null && m.homeId && m.awayId);
  }
  // Leagues Cup (penales tras empate en fase de grupos) y títulos no dependen del filtro.
  function computeStats(filter) {
    const st = {};
    state.players.forEach(p => st[p.id] = { id: p.id, name: p.name, pj: 0, w: 0, d: 0, l: 0, gf: 0, gc: 0, lc: 0, champ: 0, sub: 0 });
    statMatches(filter).forEach(m => {
      [[m.homeId, m.homeGoals, m.awayGoals], [m.awayId, m.awayGoals, m.homeGoals]].forEach(([id, f, a]) => {
        const s = st[id]; if (!s) return;
        s.pj++; s.gf += f; s.gc += a;
        if (f > a) s.w++; else if (f < a) s.l++; else s.d++;
      });
    });
    statMatches("group").forEach(m => {
      if (m.homeGoals === m.awayGoals && m.shootoutWinnerId && st[m.shootoutWinnerId]) st[m.shootoutWinnerId].lc++;
    });
    state.jornadas.forEach(j => {
      const f = j.playoff && j.playoff.final;
      const champ = f && getWinner(f);
      if (!champ) return;
      const sub = champ === f.homeId ? f.awayId : f.homeId;
      if (st[champ]) st[champ].champ++;
      if (st[sub]) st[sub].sub++;
    });
    return Object.values(st).map(s => Object.assign(s, {
      pw: s.pj ? s.w / s.pj : 0, pd: s.pj ? s.d / s.pj : 0, pl: s.pj ? s.l / s.pj : 0,
      gfp: s.pj ? s.gf / s.pj : 0, gcp: s.pj ? s.gc / s.pj : 0
    }));
  }
  const pct = x => Math.round(x * 100) + "%";
  const avg2 = x => x.toFixed(2);
  // Mejor valor de una lista (empates: todos los nombres).
  function kpiLeader(list, val, lowerIsBetter) {
    if (!list.length) return null;
    const best = list.reduce((b, s) => (lowerIsBetter ? val(s) < b : val(s) > b) ? val(s) : b, val(list[0]));
    return { names: list.filter(s => val(s) === best).map(s => s.name), best };
  }
  function kpiCard(icon, label, leader, fmt) {
    const empty = !leader || leader.best === 0 && fmt.zeroEmpty;
    return `<div class="card kpi">
        <span class="lbl">${icon} ${label}</span>
        <span class="who">${empty ? "—" : leader.names.map(escapeHtml).join(" · ")}</span>
        <span class="val">${empty ? "Sin datos todavía" : fmt(leader.best)}</span>
      </div>`;
  }
  const STAT_COLS = [
    { key: "pj", label: "PJ", title: "Partidos jugados" },
    { key: "w", label: "G", title: "Ganados" },
    { key: "d", label: "E", title: "Empatados" },
    { key: "l", label: "P", title: "Perdidos" },
    { key: "gf", label: "GF", title: "Goles a favor" },
    { key: "gc", label: "GC", title: "Goles en contra" },
    { key: "pw", label: "%G · %E · %P", title: "Porcentaje de ganados, empatados y perdidos" },
    { key: "lc", label: "Leagues Cup", title: "Desempates de penales ganados en fase de grupos" },
    { key: "champ", label: "🏆", title: "Campeonatos de Jornada" },
    { key: "sub", label: "🥈", title: "Subcampeonatos de Jornada" }
  ];
  function renderStatsModule() {
    const tabs = [["general", "Tabla General"], ["resumen", "Resumen"], ["h2h", "Cara a cara"], ["recompensas", "Recompensas"], ["palmares", "Palmarés"]]
      .map(([id, l]) => `<button class="tab-btn ${statsTab === id ? "active" : ""}" data-action="set-stats-tab" data-tab="${id}">${l}</button>`).join("");
    const filter = `<div class="st-filter">${[["all", "Todos"], ["group", "Fase de grupos"], ["ko", "Liguilla"]]
      .map(([id, l]) => `<button class="${statsFilter === id ? "active" : ""}" data-action="set-stats-filter" data-f="${id}">${l}</button>`).join("")}</div>`;
    // Tabla General, Recompensas y Palmarés (antes pestañas de Torneo).
    if (statsTab === "general") return { tabs, body: renderGeneralTable() };
    if (statsTab === "recompensas") return { tabs, body: renderRewards() };
    if (statsTab === "palmares") return { tabs, body: renderPalmares() };
    const stats = computeStats(statsFilter);
    const body = statsTab === "h2h" ? renderHeadToHead(filter) : renderStatsSummary(filter, stats);
    return { tabs, body };
  }
  function renderStatsSummary(filter, stats) {
    const maxPj = Math.max(0, ...stats.map(s => s.pj));
    const minPj = Math.ceil(maxPj / 2);
    const eligible = stats.filter(s => s.pj > 0 && s.pj >= minPj);
    const fmtN = (one, many) => { const f = v => `<strong>${v}</strong> ${v === 1 ? one : many}`; f.zeroEmpty = true; return f; };
    const kpis = `<div class="kpi-grid">
        ${kpiCard("🏅", "Más partidos ganados", kpiLeader(stats, s => s.w), fmtN("ganado", "ganados"))}
        ${kpiCard("⚽", "Mejor ofensiva", kpiLeader(eligible, s => s.gfp), v => `<strong>${avg2(v)}</strong> goles a favor por partido`)}
        ${kpiCard("🧱", "Mejor defensiva", kpiLeader(eligible, s => s.gcp, true), v => `<strong>${avg2(v)}</strong> goles en contra por partido`)}
        ${kpiCard("📈", "Mejor % de victorias", kpiLeader(eligible, s => s.pw), v => `<strong>${pct(v)}</strong> de partidos ganados`)}
        ${kpiCard("🏆", "Más campeonatos", kpiLeader(stats, s => s.champ), fmtN("título", "títulos"))}
        ${statsFilter === "ko" ? "" : kpiCard("🎯", "Más Leagues Cup", kpiLeader(stats, s => s.lc), fmtN("ganada", "ganadas"))}
      </div>`;
    // La Leagues Cup solo existe en fase de grupos: no aplica al filtrar la Liguilla.
    const cols = STAT_COLS.filter(c => !(c.key === "lc" && statsFilter === "ko"));
    // Orden fijo: más partidos ganados; en empate, más goles a favor.
    const rows = stats.slice().sort((a, b) => (b.w - a.w) || (b.gf - a.gf) || a.name.localeCompare(b.name));
    const cell = (s, c) => {
      if (c.key === "pw") return `<td style="text-align:left">${s.pj ? `<div class="wdl-bar"><span class="w" style="width:${s.pw * 100}%"></span><span class="d" style="width:${s.pd * 100}%"></span><span class="l" style="width:${s.pl * 100}%"></span></div><div class="wdl-txt">${pct(s.pw)} · ${pct(s.pd)} · ${pct(s.pl)}</div>` : `<span class="muted">–</span>`}</td>`;
      return `<td>${s[c.key]}</td>`;
    };
    const table = `
      <div class="table-scroll">
        <table class="standings stats-table">
          <thead><tr><th class="pl-head" style="text-align:left">Player</th>
            ${cols.map(c => `<th title="${c.title}">${c.label}</th>`).join("")}
          </tr></thead>
          <tbody>${rows.map(s => `<tr><td class="pl-name" style="text-align:left; font-weight:700;">${escapeHtml(s.name)}</td>${cols.map(c => cell(s, c)).join("")}</tr>`).join("")}</tbody>
        </table>
      </div>`;
    return `
      <div class="section">
        <div class="section-head"><h2>Estadísticas de la temporada</h2></div>
        ${filter}
        ${kpis}
        ${table}
        <p class="st-foot">
          Los partidos que se definen en penales cuentan como empate en G-E-P; el ganador de la tanda solo se refleja en la Leagues Cup (fase de grupos) o en su avance en la Liguilla.
          Ofensiva, defensiva y % de victorias se calculan por partido entre quienes han jugado al menos la mitad de los partidos del que más lleva${maxPj ? ` (mínimo ${minPj})` : ""}.
          ${statsFilter === "ko" ? "🏆 y 🥈 no cambian con el filtro; la Leagues Cup no se muestra porque solo se juega en fase de grupos." : "Leagues Cup, 🏆 y 🥈 no cambian con el filtro."} La tabla se ordena por partidos ganados y, en empate, por goles a favor.
        </p>
      </div>`;
  }
  function renderHeadToHead(filter) {
    const rec = {};
    const key = (a, b) => a + "|" + b;
    statMatches(statsFilter).forEach(m => {
      [[m.homeId, m.awayId, m.homeGoals, m.awayGoals], [m.awayId, m.homeId, m.awayGoals, m.homeGoals]].forEach(([a, b, f, g]) => {
        const r = rec[key(a, b)] = rec[key(a, b)] || { w: 0, d: 0, l: 0, gf: 0, gc: 0 };
        r.gf += f; r.gc += g;
        if (f > g) r.w++; else if (f < g) r.l++; else r.d++;
      });
    });
    const ps = state.players;
    const cellHtml = (a, b) => {
      if (a === b) return `<td class="self">—</td>`;
      const r = rec[key(a, b)];
      if (!r) return `<td class="none">Sin partidos</td>`;
      const cls = r.w > r.l ? "pos" : r.w < r.l ? "neg" : "";
      return `<td class="${cls}" title="${escapeHtml(playerName(a))} vs ${escapeHtml(playerName(b))}: ${r.w} G, ${r.d} E, ${r.l} P · goles ${r.gf}-${r.gc}"><div class="rec">${r.w}-${r.d}-${r.l}</div><div class="gl">${r.gf}:${r.gc}</div></td>`;
    };
    return `

          • Abajo, <strong>goles a favor : goles en contra</strong> sumando todos esos partidos. Ejemplo: <strong>1-0-2</strong> y <strong>4:9</strong> = se enfrentaron 3 veces, ganó 1 y perdió 2; metió 4 goles y le metieron 9.<br>
          Verde = le ha ganado más veces de las que ha perdido; rojo = al revés. Los partidos definidos en penales cuentan como empate.</p>
      </div>`;

  /* ============================== alineaciones ============================== */
  // Límite para subir la alineación: martes 11:59 pm (CDMX, UTC-6) inmediatamente
  // anterior a la fecha de la Jornada. Devuelve el instante en que ya es tarde
  // (miércoles 00:00 CDMX). La misma regla vive en la base (lineup_deadline).
  function lineupDeadline(playDate) {
    if (!playDate) return null;
    const [y, m, d] = playDate.split("-").map(Number);
    const dow = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
    const back = ((dow - 2 + 7) % 7) || 7;
    return new Date(Date.UTC(y, m - 1, d - back + 1, 6, 0, 0));
  }
  function formatDeadline(dl) {
    return formatCloseAt(new Date(dl.getTime() - 60000));
  }
  function formatStamp(ts) {
    return new Date(ts).toLocaleString("es-MX", { timeZone: "America/Mexico_City", weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
  }
  function lineupImgUrl(path) {
    if (!path) return null;
    return (state.lineupUrls || {})[path] || null;
  }
  function lineupOf(jornadaId, playerId) {
    return (state.lineups || []).find(l => l.jornada_id === jornadaId && l.player_id === playerId) || null;
  }
  function canEditLineup(playerId) {
    return isAdmin || myPlayerIds.includes(playerId);
  }
  function defaultLineupTab(js) {
    const next = js.find(j => { const r = jornadaRewards(j); return !(r && r.finalDone); });
    return (next || js[js.length - 1]).id;
  }
  function renderLineupsModule() {
    const js = state.jornadas.filter(j => j.jornada_number >= 1);
    if (!js.length) return { tabs: "", body: `<div class="empty-state">No hay Jornadas con alineación.</div>` };
    const validTabs = js.map(j => j.id).concat(isAdmin ? ["cuentas"] : []);
    if (!luTab || !validTabs.includes(luTab)) luTab = defaultLineupTab(js);
    const tabs = js.map(j => `<button class="tab-btn ${luTab === j.id ? "active" : ""}" data-action="set-lu-tab" data-tab="${j.id}">${escapeHtml(j.label)}</button>`).join("")
      + (isAdmin ? `<button class="tab-btn ${luTab === "cuentas" ? "active" : ""}" data-action="set-lu-tab" data-tab="cuentas">🔑 Cuentas</button>` : "");
    if (luTab === "cuentas") return { tabs, body: renderAccounts() };

    const j = js.find(x => x.id === luTab);
    const dl = lineupDeadline(j.playDate);
    const past = dl && Date.now() >= dl.getTime();
    const banner = !dl
      ? `<div class="draft-banner muted">📅 La ${escapeHtml(j.label)} aún no tiene fecha: el límite para subir la alineación se fija cuando el admin la capture.</div>`
      : `<div class="draft-banner ${past ? "closed" : "open"}"><span class="draft-tag ${past ? "closed" : "open"}" style="border-radius:6px; padding:2px 8px; font-weight:700; font-size:12px;">${past ? "CERRADO" : "ABIERTO"}</span>
          <span>Límite: <strong>${escapeHtml(formatDeadline(dl))}</strong>${past ? " · Quien la suba ahora queda marcado como <strong>tarde</strong>." : ""}</span></div>`;
    const done = state.players.filter(p => { const l = lineupOf(j.id, p.id); return l && l.submitted_at; }).length;
    const loginHint = !hasSession
      ? `<p class="lu-note" style="margin-bottom:12px;">¿Eres player? <a href="#" data-action="open-login" style="color:var(--accent)">Inicia sesión</a> para subir tu alineación.</p>`
      : (!isAdmin && !myPlayerIds.length ? `<p class="lu-note warn" style="margin-bottom:12px;">Tu correo no está ligado a ningún player; pídeselo al admin.</p>` : "");
    const order = state.players.slice().sort((a, b) => (myPlayerIds.includes(b.id) ? 1 : 0) - (myPlayerIds.includes(a.id) ? 1 : 0));
    const body = `
      <div class="section">
        <div class="section-head"><h2>Alineaciones · ${escapeHtml(j.label)}</h2><span class="sub">Entregadas: ${done}/${state.players.length}</span></div>
        ${banner}
        ${loginHint}
        <div class="lu-grid">${order.map(p => lineupCardHtml(j, p, dl, past)).join("")}</div>
      </div>`;
    return { tabs, body };
  }
  function lineupCardHtml(j, p, dl, past) {
    const l = lineupOf(j.id, p.id);
    const key = j.id + ":" + p.id;
    const draft = luDrafts[key] || {};
    const complete = !!(l && l.submitted_at);

    else if (complete) status = `<span class="lu-status ok">✅ Entregada</span>`;
    else if (past) status = `<span class="lu-status missing">${partial ? "⚠️ Incompleta" : "❌ Sin entregar"}</span>`;
    else status = `<span class="lu-status">${partial ? "🟡 Incompleta" : "⏳ Pendiente"}</span>`;
    const when = complete ? `<div class="lu-when">Entregada el ${escapeHtml(formatStamp(l.submitted_at))}</div>` : "";

    const mine = myPlayerIds.includes(p.id);
    const canEdit = canEditLineup(p.id);
    const locked = canEdit && !isAdmin && past && complete;
    const editing = canEdit && !locked;

    const img = (kind, label) => {

    let form = "";
    if (editing) {

      form = `
        <div class="lu-form">

      </div>`;
  }

  // Reduce la foto antes de subirla (lado mayor 1920 px, JPEG).
  function compressImage(file) {
    return new Promise(resolve => {
      const url = URL.createObjectURL(file);
      const im = new Image();
      im.onload = () => {
        try {
          const MAX = 1920;
          const k = Math.min(1, MAX / Math.max(im.naturalWidth, im.naturalHeight));
          const w = Math.round(im.naturalWidth * k), h = Math.round(im.naturalHeight * k);
          const c = document.createElement("canvas");
          c.width = w; c.height = h;
          c.getContext("2d").drawImage(im, 0, 0, w, h);
          c.toBlob(b => { URL.revokeObjectURL(url); resolve(b || file); }, "image/jpeg", 0.85);
        } catch (e) { URL.revokeObjectURL(url); resolve(file); }
      };
      im.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      im.src = url;
    });
  }
  function pickLineupFile(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    if (!/^image\//.test(file.type)) { showToast("Elige una imagen."); return; }
    const key = input.dataset.key, kind = input.dataset.luFile;
    const d = luDrafts[key] = luDrafts[key] || {};
    if (d[kind]) URL.revokeObjectURL(d[kind].url);
    d[kind] = { file, url: URL.createObjectURL(file) };
    render();
  }
  async function saveLineup(jornadaId, playerId) {
    if (!canEditLineup(playerId)) return;
    const key = jornadaId + ":" + playerId;
    const d = luDrafts[key] || {};
    const l = lineupOf(jornadaId, playerId);
    luSaving = key; render();
    try {
      const row = {
        season_id: state.season.id, jornada_id: jornadaId, player_id: playerId,
        code: d.code !== undefined ? (d.code.trim() || null) : (l ? l.code : null),
        starters_path: l ? l.starters_path : null,
        bench_path: l ? l.bench_path : null
      };
      for (const kind of ["starters", "bench"]) {
        if (!d[kind]) continue;
        const blob = await compressImage(d[kind].file);
        const ext = blob.type === "image/png" ? "png" : blob.type === "image/webp" ? "webp" : "jpg";
        const path = `${state.season.id}/${jornadaId}/${playerId}/${kind}-${Date.now()}.${ext}`;
        const { error } = await sb.storage.from("lineups").upload(path, blob, { contentType: blob.type || "image/jpeg", upsert: false });
        if (error) throw new Error("No se pudo subir la imagen (" + (kind === "starters" ? "titulares" : "banca") + ").");
        row[kind + "_path"] = path;
      }
      const { error } = await sb.from("lineups").upsert(row, { onConflict: "jornada_id,player_id" });
      if (error) throw new Error(/plazo/i.test(error.message || "") ? "El plazo ya cerró: tu alineación ya no se puede cambiar." : "No se pudo guardar la alineación.");
      ["starters", "bench"].forEach(k => { if (d[k]) URL.revokeObjectURL(d[k].url); });
      delete luDrafts[key];
      await loadSeasonData();
      const saved = lineupOf(jornadaId, playerId);
      const missing = [];
      if (!row.code) missing.push("código");
      if (!row.starters_path) missing.push("titulares");
      if (!row.bench_path) missing.push("banca");
      luSaving = null;
      render();
      if (missing.length) showToast("Guardado. Falta: " + missing.join(", ") + ".");
      else showToast(saved && saved.late ? "Alineación guardada (marcada como tarde)." : "Alineación guardada ✅");
    } catch (e) {
      luSaving = null;
      render();
      showToast(e.message || "No se pudo guardar la alineación.");
    }
  }
  function copyLineupCode(code) {
    const done = () => showToast("Código copiado.");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, () => showToast(code));
    else showToast(code);
  }

  // Escudo: se reduce a 256 px en PNG (conserva la transparencia).
  function shrinkLogo(file) {
    return new Promise(resolve => {
      const url = URL.createObjectURL(file);
      const im = new Image();
      im.onload = () => {
        try {
          const k = Math.min(1, 256 / Math.max(im.naturalWidth, im.naturalHeight));
          const c = document.createElement("canvas");
          c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);

          c.toBlob(b => { URL.revokeObjectURL(url); resolve(b || file); }, "image/png");
        } catch (e) { URL.revokeObjectURL(url); resolve(file); }
      };
      im.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      im.src = url;
    });
  }
  async function uploadLogo(input) {
    const id = input.dataset.logoFile;
    const file = input.files && input.files[0];
    if (!isAdmin || !file) return;
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { showToast("Usa una imagen PNG, JPG o WEBP."); return; }
    logoSaving = true; render();
    try {
      const blob = await shrinkLogo(file);
      const ext = blob.type === "image/png" ? "png" : blob.type === "image/webp" ? "webp" : "jpg";
      const path = `${state.season.id}/${id}-${Date.now()}.${ext}`;
      const up = await sb.storage.from("logos").upload(path, blob, { contentType: blob.type || "image/png", upsert: false });
      if (up.error) throw new Error("No se pudo subir el escudo.");
      const old = (state.players.find(x => x.id === id) || {}).logo_path;
      const { error } = await sb.from("players").update({ logo_path: path }).eq("id", id);
      if (error) throw new Error("No se pudo guardar el escudo.");
      if (old) { try { await sb.storage.from("logos").remove([old]); } catch (e) {} }
      logoSaving = false;
      await loadSeasonData(); render();
      showToast("Escudo de " + playerName(id) + " actualizado.");
    } catch (e) {
      logoSaving = false; render();
      showToast(e.message || "No se pudo subir el escudo.");
    }
  }
  async function removeLogo(id) {
    if (!isAdmin) return;
    if (!confirm("¿Quitar el escudo de " + playerName(id) + "?")) return;
    const old = (state.players.find(x => x.id === id) || {}).logo_path;
    const { error } = await sb.from("players").update({ logo_path: null }).eq("id", id);
    if (error) { showToast("No se pudo quitar el escudo."); return; }
    if (old) { try { await sb.storage.from("logos").remove([old]); } catch (e) {} }
    await loadSeasonData(); render();

  /* ============================== módulo: transacciones ============================== */
  const TX_KINDS = {
    bono_inicial: { label: "Bono inicial", cls: "tx-bonus" },
    bono_jornada: { label: "Bono de Jornada", cls: "tx-bonus" },
    compra: { label: "Compra", cls: "tx-buy" },
    venta: { label: "Venta", cls: "tx-sell" },
    pase: { label: "Pase", cls: "tx-pass" },
    penalizacion: { label: "Penalización", cls: "tx-pen" }
  };
  function draftLabel(key) {
    if (!key) return "Mercado abierto";
    return key === "initial" ? "Draft inicial" : "Draft de la " + key;
  }
  // Todas las transacciones reconstruidas desde los datos, en orden cronológico,
  // con el saldo de cada persona después de cada movimiento.
  function buildTransactions() {
    const tx = [];
    const seasonAt = state.season.created_at || "";
    state.players.forEach((p, i) => tx.push({ at: seasonAt, seq: i, playerId: p.id, kind: "bono_inicial", detail: "Presupuesto inicial de la temporada", amount: INITIAL_BUDGET }));
    const snaps = generalTable().snapshots;
    state.jornadas.forEach(j => {
      const r = jornadaRewards(j);
      if (!r || !r.finalDone) return;
      r.rows.forEach(row => {
        const fc = jornadaFifaCoins(j, r, snaps, row);
        if (fc == null) return;
        const place = snaps[j.label].rank[row.playerId] + "° en la Tabla General" + (row.place == null ? ", faltó" : "");
        tx.push({ at: j.updatedAt || seasonAt, seq: 100 + j.jornada_number, playerId: row.playerId, kind: "bono_jornada", detail: "FIFA Coins de la " + j.label + " (" + place + ")", amount: fc });
      });
    });
    (state.purchases || []).forEach(pu => {
      tx.push({ at: pu.created_at, seq: 1000, playerId: pu.player_id, kind: "compra", detail: "compró a " + pu.card_name + " · " + draftLabel(pu.draft), amount: -pu.price });
      if (pu.sold_at) tx.push({ at: pu.sold_at, seq: 1000, playerId: pu.player_id, kind: "venta", detail: "vendió a " + pu.card_name + " (97% de " + fcPlain(pu.price) + ")", amount: Number(pu.sale_amount) || 0 });
    });
    (state.passes || []).forEach(ps => tx.push({ at: ps.created_at, seq: 1000, playerId: ps.player_id, kind: "pase", detail: "pasó su turno · " + draftLabel(ps.draft), amount: 0 }));
    penaltyFaults().active.filter(f => f.sanction.pts || f.sanction.picks).forEach(f => tx.push({
      at: f.at, seq: 1000, playerId: f.playerId, kind: "penalizacion", amount: 0,
      detail: PEN_KINDS[f.kind].label.toLowerCase() + " (" + f.n + "ª falta, " + f.jornada.label + "): " + sanctionText(f.sanction, f.jornada)
    }));
    tx.sort((a, b) => (a.at || "").localeCompare(b.at || "") || a.seq - b.seq);
    const bal = {};
    tx.forEach(t => { bal[t.playerId] = Math.round(((bal[t.playerId] || 0) + t.amount) * 100) / 100; t.balance = bal[t.playerId]; });
    return tx;
  }
  function formatTxDate(iso) {
    if (!iso) return "–";
    return new Date(iso).toLocaleString("es-MX", { timeZone: "America/Mexico_City", day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" });
  }

                <td class="tx-date">${escapeHtml(formatTxDate(t.at))}</td>

                <td class="tx-detail"><strong>${escapeHtml(playerName(t.playerId))}</strong> ${t.kind.startsWith("bono") ? "· " : ""}${escapeHtml(t.detail).replace(/ϝ/g, FC_SYM)}</td>

  async function confirmPurchase() {
    if (!isAdmin || !buyCardId || !buyTeamId) return;
    const m = market.byId[buyCardId];
    const fin = teamFinances();
    if (fin[buyTeamId].count >= SQUAD_SIZE) { showToast(playerName(buyTeamId) + " ya tiene " + SQUAD_SIZE + " jugadores."); return; }
    if (fin[buyTeamId].balance < m.price) { showToast("Saldo insuficiente."); return; }
    if (soldMap()[m.id]) { showToast("Ese jugador ya fue comprado."); buyCardId = null; render(); return; }
    const st = marketStatus();
    if (!marketAllowsTrades(st)) { showToast("El Mercado está cerrado."); buyCardId = null; render(); return; }
    if (m.rat > ratCap()) { showToast(m.name + " se desbloquea al terminar la " + unlockLabel(m.rat) + "."); buyCardId = null; render(); return; }
    const teamId = buyTeamId;
    buyCardId = null; buyTeamId = null;
    const { error } = await sb.from("team_purchases").insert({
      season_id: state.season.id, player_id: teamId, card_id: m.id, card_name: m.name,
      pos: m.pos, rat: m.rat, wf: m.wf, sm: m.sm, price: m.price,
      draft: st.phase === "draft" ? st.key : null
    });
    if (error) showToast(error.code === "23505" ? "Ese jugador ya fue comprado."
      : /squad_full/.test(error.message || "") ? playerName(teamId) + " ya tiene " + SQUAD_SIZE + " jugadores."
      : "No se pudo registrar la compra.");
    else showToast(m.name + " → " + playerName(teamId) + " (" + fcPlain(m.price) + ")");
    await loadSeasonData(); render();
  }
  const SALE_RATE = 0.97;
  function saleAmount(price) { return Math.round(price * SALE_RATE * 100) / 100; }
  async function sellPlayer(purchaseId) {
    if (!isAdmin) return;
    const pu = (state.purchases || []).find(x => x.id === purchaseId && !x.sold_at);
    if (!pu) return;
    if (!marketAllowsTrades(marketStatus())) { showToast("El Mercado está cerrado: no se puede vender."); return; }
    const amount = saleAmount(pu.price);
    if (!confirm("¿Vender a " + pu.card_name + " (equipo de " + playerName(pu.player_id) + ")? Recibe " + fcPlain(amount) + " (97% de " + fcPlain(pu.price) + ") y el jugador regresa al Mercado.")) return;
    const { error } = await sb.from("team_purchases").update({ sold_at: new Date().toISOString(), sale_amount: amount }).eq("id", purchaseId).is("sold_at", null);
    if (error) showToast("No se pudo registrar la venta.");
    else showToast(pu.card_name + " vendido: +" + fcPlain(amount));
    await loadSeasonData(); render();
  }
  async function undoPurchase(purchaseId) {
    if (!isAdmin) return;
    const pu = (state.purchases || []).find(x => x.id === purchaseId);
    if (!pu) return;
    if (!confirm("Deshacer (corrección de captura): ¿quitar a " + pu.card_name + " del equipo de " + playerName(pu.player_id) + " como si nunca se hubiera comprado? Se reembolsa el 100% (" + fcPlain(pu.price) + "). Para una venta normal usa \"Vender\" (97%).")) return;
    const { error } = await sb.from("team_purchases").delete().eq("id", purchaseId);
    if (error) showToast("No se pudo deshacer la compra.");
    await loadSeasonData(); render();
  }


  /* ============================== root render + delegation ============================== */
  // Guarda lo que el usuario está escribiendo en los marcadores (y el foco)
  // para que un redibujado no borre un valor que aún no se ha guardado.
  function captureScoreInputs() {
    const key = el => el.dataset.match + ":" + el.dataset.side;
    const dirty = {};
    $all("input.score-box").forEach(el => { if (el.value !== el.defaultValue) dirty[key(el)] = el.value; });
    const a = document.activeElement;
    const focusKey = a && a.classList && a.classList.contains("score-box") ? key(a) : null;
    return { dirty, focusKey };
  }
  function restoreScoreInputs({ dirty, focusKey }) {
    $all("input.score-box").forEach(el => {
      const k = el.dataset.match + ":" + el.dataset.side;
      if (k in dirty) el.value = dirty[k];
      if (k === focusKey) el.focus();
    });
  }

  function render() {
    const tabsEl = $(".tabs");
    const tabsScroll = tabsEl ? tabsEl.scrollLeft : 0;
    const kept = captureScoreInputs();
    const loginVals = ["login-user", "login-pass"].map(id => { const el = document.getElementById(id); return el ? el.value : null; });
    const a = document.activeElement;
    const focusId = a && a.id && /^(market-search$|lu-code-|acc-|pen-note$|team-name-)/.test(a.id) ? a.id : null;
    const caret = focusId ? a.selectionStart : null;
    renderInner();
    restoreScoreInputs(kept);
    ["login-user", "login-pass"].forEach((id, i) => { const el = document.getElementById(id); if (el && loginVals[i]) el.value = loginVals[i]; });
    const newTabs = $(".tabs");
    if (newTabs) {
      newTabs.scrollLeft = tabsScroll;
      const act = newTabs.querySelector(".tab-btn.active");
      if (act) {
        const a = act.getBoundingClientRect(), c = newTabs.getBoundingClientRect();
        if (a.left < c.left) newTabs.scrollLeft -= (c.left - a.left) + 12;
        else if (a.right > c.right) newTabs.scrollLeft += (a.right - c.right) + 12;
      }
    }
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch (e) {} }
    }
  }
  function renderInner() {
    if (loading) {
      $("#app").innerHTML = `<div class="loading-screen">Cargando torneo…</div>`;
      return;
    }
    if (!hasSession) { renderLoginScreen(); return; }
    if (!state) { renderSetup(); return; }
    renderDashboard();
  }

  document.addEventListener("click", (e) => {
    const overlay = e.target.closest(".modal-overlay");
    if (overlay && !e.target.closest("[data-stop-close]")) { helpOpen = false; loginOpen = false; buyCardId = null; buyTeamId = null; render(); return; }

    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;

    switch (action) {
      case "pick-count": {
        renderSetup._count = parseInt(el.dataset.n, 10);
        renderSetup._names = renderSetup._names || [];
        render();
        break;
      }
      case "create-tournament": {
        if (!isAdmin) break;
        const n = renderSetup._count || 7;
        const names = [];
        for (let i = 0; i < n; i++) {
          const v = (renderSetup._names && renderSetup._names[i]) ? renderSetup._names[i].trim() : "";
          names.push(v || ("Player " + (i + 1)));
        }
        const seasonName = (renderSetup._seasonName || "").trim() || "Torneo FC27";
        loading = true; render();
        createSeason(seasonName, names).then(() => { loading = false; render(); });
        break;
      }
      case "toggle-attendance": toggleAttendance(el.dataset.j, el.dataset.p); break;
      case "toggle-flag": toggleJornadaFlag(el.dataset.j, el.dataset.p, el.dataset.kind); break;
      case "generate-jornada": generateJornada(el.dataset.j); break;
      case "generate-liguilla": generateLiguilla(el.dataset.j); break;
      case "group-pk": setGroupShootout(el.dataset.j, el.dataset.match, el.dataset.winner); break;
      case "ko-pk": setKOShootout(el.dataset.j, el.dataset.match, el.dataset.winner); break;
      case "set-tab": activeTab = el.dataset.tab; render(); break;
      case "set-module": activeModule = el.dataset.module; navOpen = false; render(); window.scrollTo(0, 0); break;
      case "open-nav": navOpen = true; render(); break;
      case "close-nav": navOpen = false; render(); break;
      case "set-team-tab": teamsTab = el.dataset.team; render(); break;
      case "market-page": marketPage += parseInt(el.dataset.dir, 10); refreshMarketResults(); break;
      case "market-page-to": marketPage = el.dataset.page === "first" ? 0 : Number.MAX_SAFE_INTEGER; refreshMarketResults(); break;
      case "retry-market": marketError = false; loadMarket(); render(); break;
      case "open-buy": buyCardId = parseInt(el.dataset.card, 10); buyTeamId = null; render(); break;
      case "buy-pick-team": buyTeamId = el.dataset.team; render(); break;
      case "close-buy": buyCardId = null; buyTeamId = null; render(); break;
      case "confirm-buy": confirmPurchase(); break;
      case "undo-purchase": undoPurchase(el.dataset.purchase); break;
      case "sell-player": sellPlayer(el.dataset.purchase); break;
      case "draft-pass": passDraftTurn(); break;
      case "open-help": helpOpen = true; render(); break;
      case "close-help": helpOpen = false; render(); break;
      case "download-backup": downloadBackup(); break;
      case "new-season": newSeasonFlow(); break;
      case "open-login": e.preventDefault(); loginOpen = true; loginError = ""; render(); break;
      case "close-login": loginOpen = false; loginError = ""; render(); break;
      case "submit-login": submitLogin(); break;
      case "admin-logout": adminLogout(); break;
      case "add-penalty": addPenalty(); break;
      case "save-magna": saveMagna(false); break;
      case "save-team-name": saveTeamName(el.dataset.p); break;
      case "remove-logo": removeLogo(el.dataset.p); break;
      case "clear-magna": if (confirm("¿Borrar el resultado de la " + (prizeStandings().magna || {}).type + "?")) saveMagna(true); break;
      case "waive-penalty": waivePenalty(el.dataset.j, el.dataset.p); break;
      case "delete-penalty": deletePenaltyRow(el.dataset.id, "¿Borrar esta falta? Se recalculan las penalizaciones."); break;
      case "restore-penalty": deletePenaltyRow(el.dataset.id, null); break;
      case "set-stats-tab": statsTab = el.dataset.tab; render(); break;
      case "set-stats-filter": statsFilter = el.dataset.f; render(); break;
      case "set-lu-tab": luTab = el.dataset.tab; render(); break;
      case "save-lineup": saveLineup(el.dataset.j, el.dataset.p); break;
      case "copy-lu-code": copyLineupCode(el.dataset.code); break;
      case "save-account": saveAccount(el.dataset.p); break;
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.target.id === "login-user" || e.target.id === "login-pass")) {
      e.preventDefault();
      submitLogin();
    }
  });

  function submitGoal(el) {
    el.dataset.sent = el.value;
    const action = el.dataset.action;
    if (action === "group-goal") setGroupGoal(el.dataset.j, el.dataset.match, el.dataset.side, el.value);
    else if (action === "ko-goal") setKOGoal(el.dataset.j, el.dataset.match, el.dataset.side, el.value);
  }
  document.addEventListener("wheel", (e) => {
    const tabs = e.target.closest && e.target.closest(".tabs");
    if (!tabs || tabs.scrollWidth <= tabs.clientWidth) return;
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    tabs.scrollLeft += e.deltaY;
    e.preventDefault();
  }, { passive: false });
  document.addEventListener("mouseover", (e) => {
    const hit = e.target.closest && e.target.closest(".gt-hit");
    if (hit) showChartTip(parseInt(hit.dataset.idx, 10));
    else if (!(e.target.closest && e.target.closest("#gt-tip"))) hideChartTip();
  });
  let chartResizeTimer = null, lastChartWidth = null;
  window.addEventListener("resize", () => {
    clearTimeout(chartResizeTimer);
    chartResizeTimer = setTimeout(() => {
      if (!$("#gt-wrap")) return;
      const w = chartWidth();
      if (w !== lastChartWidth) { lastChartWidth = w; render(); }
    }, 200);
  });
  let marketSearchTimer = null;
  document.addEventListener("input", (e) => {
    if (e.target.classList && e.target.classList.contains("lu-code-input")) {
      const key = e.target.dataset.key;
      const d = luDrafts[key] = luDrafts[key] || {};
      const had = d.code !== undefined;
      d.code = e.target.value;
      if (!had) { const btn = e.target.closest(".lu-form").querySelector("[data-action=save-lineup]"); if (btn && luSaving !== key) btn.disabled = false; }
      return;
    }
    if (e.target.classList && e.target.classList.contains("acc-input")) { accDrafts[e.target.dataset.p] = e.target.value; return; }
    if (e.target.id === "pen-note") { penForm.note = e.target.value; return; }
    if (e.target.classList && e.target.classList.contains("team-name-input")) { teamNameDraft[e.target.dataset.p] = e.target.value; return; }
    if (e.target.id !== "market-search") return;
    marketQuery = e.target.value;
    clearTimeout(marketSearchTimer);
    marketSearchTimer = setTimeout(() => { marketPage = 0; refreshMarketResults(); }, 150);
  });
  document.addEventListener("change", (e) => {
    if (e.target.dataset && e.target.dataset.luFile) { pickLineupFile(e.target); return; }
    if (e.target.dataset && e.target.dataset.logoFile) { uploadLogo(e.target); return; }
    if (e.target.classList && e.target.classList.contains("console-select")) { setJornadaConsole(e.target.dataset.j, e.target.dataset.col, e.target.value); return; }
    if (e.target.classList && e.target.classList.contains("jdate-input")) { setJornadaDate(e.target.dataset.j, e.target.value); return; }
    if (e.target.id === "tx-player") { txPlayer = e.target.value; render(); return; }
    if (e.target.classList && e.target.classList.contains("magna-select")) {
      magnaDraft = $all(".magna-select").sort((a, b) => a.dataset.k - b.dataset.k).map(x => x.value);
      return;
    }
    if (e.target.id === "pen-filter") { penPlayer = e.target.value; render(); return; }
    if (e.target.id === "pen-player") { penForm.player = e.target.value; render(); return; }
    if (e.target.id === "pen-jornada") { penForm.jornada = e.target.value; render(); return; }
    if (e.target.id === "tx-kind") { txKind = e.target.value; render(); return; }
    if (e.target.id === "market-pos") { marketPos = e.target.value; marketPage = 0; refreshMarketResults(); return; }
    if (e.target.id === "market-available") { marketOnlyAvailable = e.target.checked; marketPage = 0; refreshMarketResults(); return; }
    const el = e.target.closest("[data-action]");
    if (!el) return;
    if (el.dataset.action === "group-goal" || el.dataset.action === "ko-goal") submitGoal(el);
  });
  // Si la casilla se redibujó mientras se escribía, el navegador no dispara
  // "change" al salir; se guarda aquí el valor pendiente.
  document.addEventListener("focusout", (e) => {
    const el = e.target;
    if (!el.classList || !el.classList.contains("score-box")) return;
    if (el.value !== el.defaultValue && el.dataset.sent !== el.value) submitGoal(el);
  });

  /* ============================== init ============================== */
  async function init() {
    render(); // loading screen
    const { data: { session } } = await sb.auth.getSession();
    await refreshRole(session);
    sb.auth.onAuthStateChange((_event, newSession) => {
      const before = [isAdmin, hasSession, myPlayerIds.join()].join("|");
      // Fuera del callback: supabase-js no permite esperar otras llamadas aquí.
      setTimeout(() => {
        const had = hasSession;
        if (!newSession) { if (had) endSession(); return; }
        refreshRole(newSession).then(() => {
          if (!had && !loading) { startSession(); return; } // sesión iniciada en otra pestaña
          if (!loading && before !== [isAdmin, hasSession, myPlayerIds.join()].join("|")) render();
        });
      }, 0);
    });
    if (hasSession) await startSession();
    else { loading = false; render(); }
  }
  init();
})();
</script>
</body>
</html>
