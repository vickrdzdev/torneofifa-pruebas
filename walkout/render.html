<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkout</title>
<!-- Página que usa la grabación del video de compra (walkout/record.js, en GitHub Actions).
     Es una copia de la animación walkout() de index.html sin los botones Saltar/¡Listo!;
     si cambia el diseño allá, hay que copiarlo aquí también. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;600;700;800&display=block" rel="stylesheet">
<style>
  :root { --font-display: 'Barlow Condensed', 'Oswald', sans-serif; --font-body: 'Inter', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  /* Se graba a 720×1280 con todo al doble (equivale a un celular de 360×640). */
  html { zoom: 2; }
  /* Fondo blanco hasta que arranca: así record.js encuentra el primer cuadro de la animación. */
  html, body { margin: 0; height: 100%; background: #fff; font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  /* Copia de los estilos .wo-* de index.html. */
  .wo-layer { --wo1: #c9893a; --wo2: #f5d27a; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: radial-gradient(circle at 50% 45%, #13261d 0%, #05090a 70%); color: #fff; animation: wo-in .3s ease; }
  .wo-layer.wo-plata { --wo1: #8b98a5; --wo2: #e6edf3; }
  .wo-layer.wo-bronce { --wo1: #8a5a33; --wo2: #d9a774; }
  .wo-layer.wo-elite { --wo1: #6d3fd6; --wo2: #f3d27a; }
  .wo-elite .wo-card { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
  .wo-beams { position: absolute; inset: -50%; background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--wo2) 22%, transparent) 0 6deg, transparent 6deg 24deg);
    animation: wo-spin 14s linear infinite; opacity: .55; mask-image: radial-gradient(circle, #000 0%, transparent 60%); -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 60%); }
  .wo-stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 20px; text-align: center; }
  .wo-step { display: flex; flex-direction: column; align-items: center; gap: 6px; animation: wo-pop .55s cubic-bezier(.2, 1.4, .4, 1); }
  .wo-lbl { font-size: 13px; font-weight: 800; letter-spacing: .25em; text-transform: uppercase; color: var(--wo2); opacity: .85; }
  .wo-big { font-family: var(--font-display); font-weight: 800; font-size: 96px; line-height: 1; text-shadow: 0 0 30px var(--wo1), 0 0 60px var(--wo1); }
  .wo-mid { font-family: var(--font-display); font-weight: 800; font-size: 54px; line-height: 1; text-shadow: 0 0 24px var(--wo1); }
  .wo-sub { font-size: 15px; font-weight: 600; color: #e9efe9; }
  .wo-skip { position: absolute; right: 14px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 8px 16px; font: inherit; font-weight: 700; }
  .wo-card { position: relative; width: 230px; padding: 16px 16px 14px; border-radius: 18px 18px 26px 26px; overflow: hidden;
    background: linear-gradient(160deg, var(--wo2), var(--wo1) 55%, color-mix(in srgb, var(--wo1) 60%, #000)); color: #10170f;
    box-shadow: 0 0 40px color-mix(in srgb, var(--wo2) 60%, transparent), 0 12px 30px rgba(0,0,0,.6); animation: wo-flip .9s cubic-bezier(.2, 1.2, .3, 1); }
  .wo-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.65) 50%, transparent 65%); transform: translateX(-120%); animation: wo-shine 1.4s .5s ease; }
  .wo-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .wo-card-top { display: flex; flex-direction: column; align-items: center; min-width: 54px; }
  .wo-card-rat { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; }
  .wo-card-pos { font-weight: 800; font-size: 15px; }
  .wo-card-ph { width: 110px; height: 110px; margin: 2px 4px 4px 0; border-radius: 50%; overflow: hidden; background: rgba(0,0,0,.18); }
  .wo-card-ph img { width: 100%; height: 100%; object-fit: cover; }
  .wo-card-name { font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.1; padding: 4px 0 8px; border-bottom: 1px solid rgba(0,0,0,.2); }
  .wo-card-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 6px; padding: 8px 0; }
  .wo-stat { display: flex; gap: 5px; justify-content: center; align-items: baseline; font-size: 12px; font-weight: 700; }
  .wo-stat b { font-family: var(--font-display); font-size: 19px; }
  .wo-card-foot { font-size: 12.5px; font-weight: 700; opacity: .85; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .wo-ok { width: auto; padding: 12px 34px; animation: wo-pop .5s .6s both; }
  .wo-layer [hidden] { display: none !important; }
  .wo-fw { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .wo-stars { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .wo-stars + .wo-stars { margin-top: 14px; }
  .wo-stars b { font-size: 44px; line-height: 1.1; letter-spacing: 4px; color: var(--wo2); text-shadow: 0 0 18px var(--wo1); }
  .wo-img { width: 84px; height: 84px; object-fit: contain; filter: drop-shadow(0 0 16px var(--wo1)); }
  .wo-flag { width: 110px; height: auto; border-radius: 6px; box-shadow: 0 0 28px var(--wo1); }
  .wo-tr { display: flex; align-items: center; gap: 10px; }
  .wo-tr-side { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 112px; }
  .wo-tr-side .wo-img { width: 72px; height: 72px; }
  .wo-tr-ph { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .wo-tr-name { font-size: 14px; font-weight: 700; color: #e9efe9; line-height: 1.2; }
  .wo-tr-arrow { font-family: var(--font-display); font-size: 44px; font-weight: 800; color: var(--wo2); text-shadow: 0 0 18px var(--wo1); animation: wo-slide .8s ease-in-out infinite alternate; }
  .wo-card-icons { display: flex; flex-direction: column; align-items: center; gap: 5px; margin-top: 6px; }
  .wo-card-icons img { width: 26px; height: 26px; object-fit: contain; }
  .wo-card-icons img.wo-ci-flag { width: 28px; height: auto; border-radius: 3px; }
  @keyframes wo-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes wo-spin { to { transform: rotate(360deg); } }
  @keyframes wo-pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
  @keyframes wo-flip { 0% { opacity: 0; transform: perspective(700px) rotateY(180deg) scale(.5); } 100% { opacity: 1; transform: perspective(700px) rotateY(0) scale(1); } }
  @keyframes wo-shine { to { transform: translateX(120%); } }
  @keyframes wo-slide { from { transform: translateX(-6px); } to { transform: translateX(6px); } }
</style>
</head>
<body>
<script>
  // window.WO (lo pone record.js): { name, pos, altPos, foot, sm, wf, rat, pac, sho, pas, dri, def, phy, photo, price, buyer,
  //   nation, league, club (ligas de imágenes), from: { name, logo }, to: { name, logo } }
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fcNumber = n => { const a = Math.abs(n); return Number.isInteger(Math.round(a * 100) / 100) ? String(Math.round(a)) : a.toFixed(2); };
  // Mismos tiempos que la app (WO_AT en index.html), en segundos.
  const STEPS = { nation: 0.9, league: 2.0, pos: 3.1, foot: 4.2, transfer: 5.3, rat: 6.9, card: 8.5 };
  const woTier = rat => rat >= 88 ? "elite" : rat >= 84 ? "oro" : rat >= 78 ? "plata" : "bronce";
  const woStars = n => "★★★★★".slice(0, n) + "☆☆☆☆☆".slice(0, 5 - n);
  // Una imagen que no cargó (WO_READY) no se pone: se usa el ícono de respaldo.
  const ok = url => !!url && (window.WO_IMGS || {})[url] !== false;
  const woImg = (url, cls) => ok(url) ? `<img class="${cls}" src="${esc(url)}" alt="" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">` : "";
  const woSide = x => `<div class="wo-tr-side">${x && ok(x.logo) ? woImg(x.logo, "wo-img") : `<span class="wo-tr-ph">⚽</span>`}${x && x.name ? `<span class="wo-tr-name">${esc(x.name)}</span>` : ""}</div>`;

  // Precarga imágenes y fuentes antes de arrancar (record.js espera window.WO_READY).
  window.WO_READY = (async () => {
    const m = window.WO;
    const urls = [m.photo, m.nation, m.league, m.club, m.from && m.from.logo, m.to && m.to.logo].filter(Boolean);
    window.WO_IMGS = {};
    await Promise.all(urls.map(u => new Promise(r => {
      const i = new Image(); i.referrerPolicy = "no-referrer";
      i.onload = () => { window.WO_IMGS[u] = true; r(); }; i.onerror = () => { window.WO_IMGS[u] = false; r(); };
      i.src = u; setTimeout(r, 8000);
    })));
    try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 8000))]); } catch (e) {}
    return window.WO_IMGS;
  })();

  // Fuegos artificiales detrás de la tarjeta: un canvas con explosiones de partículas.
  // scale: píxeles del canvas por píxel de pantalla. Devuelve una función para detenerlos.
  // La misma función está en index.html y walkout/render.html.
  function woFireworks(layer, scale) {
    const cv = document.createElement("canvas");
    cv.className = "wo-fw";
    layer.insertBefore(cv, layer.querySelector(".wo-stage"));
    const ctx = cv.getContext("2d");
    const W = cv.width = Math.round(layer.clientWidth * scale), H = cv.height = Math.round(layer.clientHeight * scale);
    const st = getComputedStyle(layer);
    const cols = [st.getPropertyValue("--wo2").trim() || "#f5d27a", st.getPropertyValue("--wo1").trim() || "#c9893a", "#ffffff", "#ff6b6b", "#4fd1ff", "#7dff8a", "#ffd93d"];
    let parts = [], next = 0, last = 0, raf = 0, alive = true;
    const burst = () => {
      // Alrededor de la tarjeta (arriba o a los lados), no detrás del centro.
      const side = Math.random();
      const x = side < 0.35 ? W * (0.08 + Math.random() * 0.22) : side < 0.7 ? W * (0.7 + Math.random() * 0.22) : W * (0.2 + Math.random() * 0.6);
      const y = side < 0.7 ? H * (0.15 + Math.random() * 0.6) : H * (0.08 + Math.random() * 0.14);
      const c = cols[Math.floor(Math.random() * cols.length)], n = 60 + Math.floor(Math.random() * 25), sp = (3.6 + Math.random() * 2.2) * scale;
      for (let i = 0; i < n; i++) {
        const ang = (i / n) * Math.PI * 2 + Math.random() * 0.2, v = sp * (0.6 + Math.random() * 0.5);
        parts.push({ x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, life: 1, c, r: (2 + Math.random() * 1.6) * scale });
      }
    };
    const loop = t => {
      if (!alive) return;
      const k = last ? Math.min(3, (t - last) / 16.7) : 1;
      last = t;
      if (t >= next) { burst(); if (!next) burst(); next = t + 300 + Math.random() * 300; }
      ctx.clearRect(0, 0, W, H);
      parts = parts.filter(p => p.life > 0);
      for (const p of parts) {
        p.vx *= Math.pow(0.97, k); p.vy = p.vy * Math.pow(0.97, k) + 0.05 * scale * k;
        p.x += p.vx * k; p.y += p.vy * k; p.life -= 0.011 * k;
        ctx.fillStyle = p.c;
        ctx.globalAlpha = Math.max(0, p.life) * 0.25;  // brillo
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2.6, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => { alive = false; cancelAnimationFrame(raf); cv.remove(); };
  }

  window.WO_START = () => {
    const m = window.WO;
    const layer = document.createElement("div");
    layer.className = "wo-layer wo-" + woTier(m.rat);
    layer.innerHTML = `<div class="wo-beams"></div><div class="wo-stage"></div>`;
    document.body.appendChild(layer);
    const stage = layer.querySelector(".wo-stage");
    const show = html => { stage.innerHTML = `<div class="wo-step">${html}</div>`; };
    const at = (s, fn) => setTimeout(fn, s * 1000);
    at(STEPS.nation, () => show(`${ok(m.nation) ? woImg(m.nation, "wo-flag") : `<span class="wo-big">🌍</span>`}`));
    at(STEPS.league, () => show(`${ok(m.league) ? woImg(m.league, "wo-img") : `<span class="wo-big">🏟️</span>`}`));
    at(STEPS.pos, () => show(`<span class="wo-big">${esc(m.pos)}</span>${m.altPos ? `<span class="wo-sub">${esc(m.altPos)}</span>` : ""}`));
    at(STEPS.foot, () => show(`<span class="wo-stars"><span class="wo-sub">Regate</span><b>${woStars(m.sm || 0)}</b></span>
      <span class="wo-stars"><span class="wo-sub">Pierna mala</span><b>${woStars(m.wf || 0)}</b></span>`));
    at(STEPS.transfer, () => show(`<div class="wo-tr">${woSide(m.from)}<span class="wo-tr-arrow">➜</span>${woSide(m.to)}</div>`));
    at(STEPS.rat, () => {
      show(`<span class="wo-lbl">RAT</span><span class="wo-big wo-rat">0</span>`);
      const el = stage.querySelector(".wo-rat"), from = Math.max(40, m.rat - 25), t0 = performance.now();
      const tick = () => {
        const k = Math.min(1, (performance.now() - t0) / 1100);
        el.textContent = Math.round(from + (m.rat - from) * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(tick);
      };
      tick();
    });
    at(STEPS.card, () => {
      const stats = [["RIT", m.pac], ["TIR", m.sho], ["PAS", m.pas], ["REG", m.dri], ["DEF", m.def], ["FÍS", m.phy]]
        .map(([k, v]) => `<span class="wo-stat"><b>${v == null ? "–" : v}</b>${k}</span>`).join("");
      stage.innerHTML = `
        <div class="wo-card">
          <div class="wo-card-head"><div class="wo-card-top"><span class="wo-card-rat">${m.rat}</span><span class="wo-card-pos">${esc(m.pos)}</span>
            <span class="wo-card-icons">${woImg(m.nation, "wo-ci-flag")}${woImg(m.to && m.to.logo, "")}</span></div>
          <div class="wo-card-ph">${woImg(m.photo, "")}</div></div>
          <div class="wo-card-name">${esc(m.name)}</div>
          <div class="wo-card-stats">${stats}</div>
          <div class="wo-card-foot">${esc(m.buyer)} · ϝ${fcNumber(m.price)}</div>
        </div>`;
      woFireworks(layer, 2);  // la página se graba con zoom 2
    });
  };

  // Música de fondo sintetizada (sin archivos ni derechos): batucada a 124 bpm con surdo, caja,
  // tamborim y agogó, y silbatazos al arrancar (en la tarjeta suena el efecto "reveal").
  // a: AudioContext u OfflineAudioContext; out: nodo de salida; t0: inicio; len: segundos de batucada.
  // La misma función está en index.html y walkout/render.html.
  function woMusic(a, out, t0, len) {
    const s16 = 60 / 124 / 4, end = t0 + len;
    const n = Math.floor(a.sampleRate * 0.5), nb = a.createBuffer(1, n, a.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < n; i++) nd[i] = Math.random() * 2 - 1;
    const env = (g, t, v, att, dec) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + att + dec); };
    const osc = (type, f, t, v, att, dec, f2) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + att + dec);
      env(g, t, v, att, dec); o.connect(g).connect(out); o.start(t); o.stop(t + att + dec + 0.05);
    };
    const noise = (t, v, dec, fq) => {
      const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
      s.buffer = nb; f.type = "highpass"; f.frequency.value = fq; env(g, t, v, 0.003, dec);
      s.connect(f).connect(g).connect(out); s.start(t); s.stop(t + dec + 0.05);
    };
    const whistle = (t, dur) => {
      const o = a.createOscillator(), lfo = a.createOscillator(), lg = a.createGain(), g = a.createGain();
      o.frequency.value = 2900; lfo.frequency.value = 26; lg.gain.value = 160; lfo.connect(lg).connect(o.frequency);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
      g.gain.setValueAtTime(0.07, t + dur - 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(out); o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
    };
    for (let i = 0; t0 + i * s16 < end - 0.2; i++) {
      const t = t0 + i * s16, p = i % 8, q = i % 16;
      if (p === 0) osc("sine", 95, t, 0.3, 0.005, 0.3, 50);         // surdo de resposta
      if (p === 4) osc("sine", 80, t, 0.5, 0.005, 0.4, 42);         // surdo de marcação
      noise(t, [0.07, 0.025, 0.04, 0.025][i % 4] * (p === 4 ? 1.4 : 1), 0.06, 2600);  // caixa
      if (p === 0 || p === 3 || p === 6) osc("square", 1150, t, 0.025, 0.002, 0.05); // tamborim
      if (q === 0 || q === 8) osc("triangle", 1320, t, 0.05, 0.003, 0.16);            // agogó agudo
      if (q === 2 || q === 10 || q === 11) osc("triangle", 990, t, 0.05, 0.003, 0.16); // agogó grave
    }
    whistle(t0 + 0.05, 0.11); whistle(t0 + 0.24, 0.11); whistle(t0 + 0.43, 0.42);
  }

  // Sonido: los mismos efectos de la app, renderizados a WAV (base64) con OfflineAudioContext.
  window.WO_AUDIO = async (seconds) => {
    const SR = 44100, a = new OfflineAudioContext(1, Math.ceil(SR * seconds), SR);
    function tone(freq, t, dur, type, vol, slideTo) {
      const o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
    }
    function noise(t, dur, vol, from, to) {
      const n = Math.floor(SR * dur), buf = a.createBuffer(1, n, SR), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
      src.buffer = buf; f.type = "bandpass"; f.Q.value = 1.2;
      f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f).connect(g).connect(a.destination); src.start(t); src.stop(t + dur);
    }
    const snd = (kind, t) => {
      if (kind === "rise") { noise(t, 1.4, 0.25, 150, 1800); tone(55, t, 1.4, "sine", 0.2, 110); }
      else if (kind === "hit") { tone(110, t, 0.45, "sine", 0.5, 45); noise(t, 0.3, 0.2, 2500, 300); }
      else if (kind === "tick") tone(1400, t, 0.05, "square", 0.04);
      else if (kind === "reveal") { [523.3, 659.3, 784, 1046.5, 1318.5].forEach((f, i) => tone(f, t + i * 0.08, 0.9, "triangle", 0.16)); noise(t, 0.8, 0.12, 3000, 9000); }
    };
    snd("rise", 0.02); ["nation", "league", "pos", "foot", "transfer"].forEach(k => snd("hit", STEPS[k])); snd("rise", STEPS.rat);
    for (let t = STEPS.rat; t < STEPS.rat + 1.1; t += 0.04) if (Math.random() < 0.35) snd("tick", t);
    snd("reveal", STEPS.card);
    const bus = a.createGain(); bus.connect(a.destination);
    bus.gain.setValueAtTime(0.7, 0); bus.gain.setValueAtTime(0.7, seconds - 1); bus.gain.linearRampToValueAtTime(0.0001, seconds - 0.1);  // se desvanece al final
    woMusic(a, bus, 0.02, seconds - 0.1);
    const d = (await a.startRendering()).getChannelData(0), n = d.length;
    const ab = new ArrayBuffer(44 + n * 2), v = new DataView(ab);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVEfmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, SR, true); v.setUint32(28, SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, d[i])) * 32767, true);
    let s = ""; const u = new Uint8Array(ab);
    for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768));
    return btoa(s);
  };
